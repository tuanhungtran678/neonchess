<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NeonChess Ultimate</title>

<style>

/* ========================= RESET ========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0b1020;
color:white;
overflow:hidden;
}

/* ========================= LAYOUT ========================= */

.app{
display:flex;
height:100vh;
}

/* ========================= SIDEBAR ========================= */

.sidebar{
width:240px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
padding:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.btn{
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
background:rgba(0,255,180,0.15);
color:white;
font-weight:bold;
}

.btn:hover{
background:rgba(0,255,180,0.35);
}

/* ========================= MAIN ========================= */

.main{
flex:1;
display:flex;
flex-direction:column;
}

/* ========================= TOPBAR ========================= */

.topbar{
display:flex;
justify-content:space-between;
padding:15px;
background:rgba(255,255,255,0.04);
}

.logo{
font-size:22px;
font-weight:900;
background:linear-gradient(90deg,#00ffae,#00c3ff);
-webkit-background-clip:text;
color:transparent;
}

/* ========================= MENU ========================= */

.menu{
display:flex;
gap:10px;
padding:10px;
}

.mode{
padding:8px 12px;
border-radius:8px;
border:none;
cursor:pointer;
background:rgba(255,255,255,0.1);
color:white;
}

.mode.active{
background:#00ffae;
color:#000;
}

/* ========================= BOARD ========================= */

.board-wrap{
display:flex;
justify-content:center;
padding:10px;
}

.board{
width:520px;
height:520px;
display:grid;
grid-template-columns:repeat(8,1fr);
grid-template-rows:repeat(8,1fr);
border-radius:12px;
overflow:hidden;
}

.square{
display:flex;
justify-content:center;
align-items:center;
}

.light{background:#f0d9b5;}
.dark{background:#b58863;}

.piece{
width:90%;
height:90%;
object-fit:contain;
}

/* ========================= CHAT ========================= */

.chat{
width:300px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
display:flex;
flex-direction:column;
}

.messages{
flex:1;
overflow:auto;
padding:10px;
font-size:12px;
}

.msg{
margin-bottom:8px;
padding:6px;
background:rgba(0,0,0,0.3);
border-radius:6px;
}

.time{
font-size:10px;
opacity:0.6;
}

.input{
display:flex;
}

input{
flex:1;
padding:10px;
border:none;
outline:none;
}

.send{
padding:10px;
border:none;
background:#00ffae;
cursor:pointer;
}

/* ========================= LOGIN ========================= */

.login{
position:absolute;
top:10px;
right:10px;
}

</style>
</head>

<body>

<div class="app">

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">

<button class="btn">Play</button>
<button class="btn">Puzzle</button>
<button class="btn">Trainer</button>
<button class="btn">Profile</button>
<button class="btn" onclick="login()">Google Login</button>

</div>

<!-- ================= MAIN ================= -->
<div class="main">

<div class="topbar">
<div class="logo">NeonChess</div>

<div>
<select id="mode" class="mode">
<option value="10">Bullet 10s</option>
<option value="30">Blitz 30s</option>
<option value="daily">Daily</option>
</select>
</div>

</div>

<!-- MENU -->
<div class="menu">
<button class="mode active">Home</button>
<button class="mode">Ranked</button>
<button class="mode">Live</button>
</div>

<!-- BOARD -->
<div class="board-wrap">
<div id="board" class="board"></div>
</div>

</div>

<!-- ================= CHAT ================= -->
<div class="chat">

<div id="messages" class="messages"></div>

<div class="input">
<input id="msgInput" placeholder="chat..."/>
<button class="send" onclick="sendMsg()">➤</button>
</div>

</div>

</div>

<!-- ================= FIREBASE ================= -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import {
getDatabase, ref, push, onValue
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

const firebaseConfig = {
apiKey:"YOUR_KEY",
authDomain:"YOUR_DOMAIN",
databaseURL:"YOUR_DB",
projectId:"YOUR_ID",
storageBucket:"YOUR_BUCKET",
messagingSenderId:"ID",
appId:"ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

/* ================= LOGIN ================= */

window.login = async ()=>{
await signInWithPopup(auth,provider);
}

/* ================= CHAT ================= */

window.sendMsg = ()=>{
const input = document.getElementById("msgInput");

push(ref(db,"chat"),{
text:input.value,
time:new Date().toLocaleTimeString()
});

input.value="";
}

onValue(ref(db,"chat"),(snap)=>{
const box = document.getElementById("messages");
box.innerHTML="";

snap.forEach(c=>{
const v=c.val();
box.innerHTML += `
<div class="msg">
${v.text}
<div class="time">${v.time}</div>
</div>`;
});
});

</script>

<!-- ================= CHESS ================= -->
<script>

const board = document.getElementById("board");

function draw(){

board.innerHTML="";

for(let i=0;i<64;i++){

const div = document.createElement("div");

div.className="square "+(((Math.floor(i/8)+i)%2)?"dark":"light");

const img=document.createElement("div");
img.className="piece";
img.innerHTML="♟";

div.appendChild(img);

board.appendChild(div);

}

}

draw();

</script>

</body>
</html>
