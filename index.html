<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NeonChess</title>

<link
rel="icon"
href="assets/icons/logo.png">

<!-- ============================== -->
<!-- CSS -->
<!-- ============================== -->

<link
rel="stylesheet"
href="css/style.css">

<link
rel="stylesheet"
href="css/board.css">

<link
rel="stylesheet"
href="css/editor.css">

<link
rel="stylesheet"
href="css/animations.css">

</head>

<body>

<!-- ============================== -->
<!-- BACKGROUND -->
<!-- ============================== -->

<div class="bg">

<div class="glow glow1"></div>

<div class="glow glow2"></div>

</div>

<!-- ============================== -->
<!-- MAIN CONTAINER -->
<!-- ============================== -->

<div class="container">

<!-- ============================== -->
<!-- SIDEBAR -->
<!-- ============================== -->

<aside class="sidebar">

<div class="logo">

♟ NeonChess

</div>

<div class="menu">

<button id="bulletBtn">
⚡ Bullet
</button>

<button id="blitzBtn">
🔥 Blitz
</button>

<button id="rapidBtn">
🧠 Rapid
</button>

<button id="multiBtn">
🌍 Multiplayer
</button>

<button id="puzzleBtn">
🧩 Puzzle
</button>

<button id="aiBtn">
🤖 Play vs AI
</button>

<button id="trainerBtn">
🎯 Trainer
</button>

<button id="editorBtn">
🎬 Edit Video
</button>

</div>

</aside>

<!-- ============================== -->
<!-- MAIN -->
<!-- ============================== -->

<main class="main">

<!-- ============================== -->
<!-- TOPBAR -->
<!-- ============================== -->

<div class="topbar">

<div>

<div class="title">

NeonChess

</div>

<div class="subtitle">

PS5 Style Chess Experience

</div>

</div>

<button
class="login-btn"
id="loginBtn">

🔐 Login Google

</button>

</div>

<!-- ============================== -->
<!-- HERO -->
<!-- ============================== -->

<section class="hero">

<h1>

Play Chess
Like a
<span>PS5 Game</span>

</h1>

</section>

<!-- ============================== -->
<!-- CONTENT -->
<!-- ============================== -->

<div class="content">

<!-- ============================== -->
<!-- BOARD CARD -->
<!-- ============================== -->

<section class="card">

<div class="board-wrapper">

<div
id="board"
class="board"></div>

</div>

<div class="actions">

<button id="newGameBtn">

♻ New Game

</button>

<button id="bestMoveBtn">

🤖 Best Move

</button>

</div>

<div class="history">

<h3>

📜 Match History

</h3>

<div id="moves"></div>

</div>

</section>

<!-- ============================== -->
<!-- PROFILE -->
<!-- ============================== -->

<section class="card">

<div class="profile">

<img
id="avatar"
class="avatar"
src="https://github.com/tuanhungtran678/neonchess/blob/main_chess/assets/image/default-avatar.png">

<h2 id="username">

Guest 🇻🇳

</h2>

<p id="email">

Not logged in

</p>

<div class="badge">

ADMIN SITE

</div>

</div>

</section>

</div>

</main>

</div>

<!-- ============================== -->
<!-- VIDEO EDITOR -->
<!-- ============================== -->

<div id="editorModal">

<div class="editor">

<!-- ============================== -->
<!-- PREVIEW -->
<!-- ============================== -->

<div class="preview">

<video
id="videoPreview"
class="video-preview"
controls>
</video>

<button
id="closeEditorBtn">

✕ Close

</button>

</div>

<!-- ============================== -->
<!-- LAYERS -->
<!-- ============================== -->

<div class="layers">

<h2>

🎬 Layers & Assets

</h2>

<div class="editor-toolbar">

<button class="editorBtn">

➕ Video

</button>

<button class="editorBtn">

🎵 Audio

</button>

<button class="editorBtn">

🖼 Image

</button>

<button class="editorBtn">

📝 Text

</button>

</div>

<input
type="file"
id="videoUpload"
accept="video/*">

<input
type="file"
id="audioUpload"
accept="audio/*">

<div class="layer">

🎵 Audio Track

</div>

<div class="layer">

🖼 Overlay Image

</div>

<div class="layer">

♟ Chess Board

</div>

<div class="layer">

✨ Neon Effect

</div>

<div class="layer">

📝 Subtitle

</div>

</div>

<!-- ============================== -->
<!-- TIMELINE -->
<!-- ============================== -->

<div class="timeline">

<h3>

⏱ Timeline

</h3>

<div class="timeline-bar">

<div
class="clip clip-video"
style="
left:0%;
width:60%;
top:18px;
"></div>

<div
class="clip clip-audio"
style="
left:10%;
width:40%;
bottom:18px;
"></div>

<div class="playhead"></div>

</div>

</div>

</div>

</div>

<!-- ============================== -->
<!-- AUDIO -->
<!-- ============================== -->

<audio
id="moveSound">
</audio>

<audio
id="captureSound">
</audio>

<!-- ============================== -->
<!-- JS -->
<!-- ============================== -->

<script
type="module"
src="js/app.js">
</script>

</body>
</html>
```
