<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NeonChess FIXED</title>

<style>

body{
    margin:0;
    background:#0b1220;
    color:white;
    font-family:Arial;
}

/* ================= BOARD ================= */

.board{
    width:520px;
    height:520px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);
    border:4px solid #00ffae;
    border-radius:10px;
    overflow:hidden;
}

.square{
    display:flex;
    align-items:center;
    justify-content:center;
}

.light{ background:#f0d9b5; }
.dark{ background:#b58863; }

.piece{
    width:80%;
    height:80%;
    cursor:pointer;
}

/* ================= UI ================= */

.top{
    display:flex;
    justify-content:space-between;
    padding:10px;
}

button{
    padding:10px 14px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.login{
    background:linear-gradient(90deg,#00ffae,#00c3ff);
    font-weight:bold;
}

.panel{
    padding:10px;
}

</style>
</head>

<body>

<div class="top">

    <h2>♟ NeonChess FIX</h2>

    <button class="login" id="loginBtn">
        Login Google
    </button>

</div>

<div class="panel" id="userInfo">
    Chưa đăng nhập
</div>

<div id="board" class="board"></div>

<script type="module">

import { Chess } from "https://cdn.jsdelivr.net/npm/chess.js@1.0.0-beta.6/+esm";

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

/* ================= FIREBASE ================= */

const firebaseConfig = {
    apiKey: "AIzaSyByZbESWCAXypIJKBUNIm6KDmcXWX7SMgk",
    authDomain: "neonchess-df7aa.firebaseapp.com",
    projectId: "neonchess-df7aa",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

/* ================= LOGIN ================= */

const loginBtn = document.getElementById("loginBtn");

loginBtn.onclick = async () => {
    const res = await signInWithPopup(auth, provider);
    console.log(res.user);
};

/* ================= AUTH UI ================= */

onAuthStateChanged(auth, (user) => {

    const info = document.getElementById("userInfo");

    if(user){
        info.innerHTML =
        "👤 " + user.displayName + "<br>" + user.email;

        loginBtn.innerText = "Logout";

        loginBtn.onclick = () => signOut(auth);
    }
    else{
        info.innerText = "Chưa đăng nhập";
        loginBtn.innerText = "Login Google";

        loginBtn.onclick = () =>
        signInWithPopup(auth, provider);
    }

});

/* ================= CHESS ================= */

const game = new Chess();

let selected = null;

const pieces = {
r:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/br.png",
n:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/bn.png",
b:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/bb.png",
q:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/bq.png",
k:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/bk.png",
p:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/bp.png",
R:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wr.png",
N:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wn.png",
B:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wb.png",
Q:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wq.png",
K:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wk.png",
P:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wp.png"
};

function draw(){

const board = document.getElementById("board");
board.innerHTML = "";

const state = game.board();

for(let y=0;y<8;y++){
for(let x=0;x<8;x++){

const sq = document.createElement("div");
sq.className = "square " + ((x+y)%2?"dark":"light");

const file = "abcdefgh"[x];
const rank = 8-y;
const name = file+rank;

const piece = state[y][x];

if(piece){

const code = piece.color==="w"
? piece.type.toUpperCase()
: piece.type;

const img = document.createElement("img");
img.src = pieces[code];
img.className = "piece";

sq.appendChild(img);
}

sq.onclick = () => {

if(selected){

const move = game.move({
from:selected,
to:name,
promotion:"q"
});

selected = null;
draw();
return;
}

const p = game.get(name);
if(p){
selected = name;
}

};

board.appendChild(sq);

}}

}

draw();

</script>

</body>
</html>
