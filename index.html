<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NeonChess PS5 Edition</title>

<link
rel="icon"
href="https://www.chess.com/bundles/web/images/favicon.7cca8c77.ico">

<style>

/* ========================================================= */
/* RESET */
/* ========================================================= */

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

    font-family:
    Arial,sans-serif;
}

body{

    background:
    linear-gradient(
        135deg,
        #020617,
        #0f172a
    );

    color:white;

    min-height:100vh;

    overflow-x:hidden;
}

/* ========================================================= */
/* PS5 BACKGROUND */
/* ========================================================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:

    radial-gradient(
        circle at top left,
        rgba(0,255,255,.18),
        transparent 35%
    ),

    radial-gradient(
        circle at bottom right,
        rgba(0,255,174,.14),
        transparent 35%
    );

    animation:
    glowMove 10s linear infinite;

    pointer-events:none;
}

@keyframes glowMove{

    0%{

        transform:
        translate(0px,0px);

    }

    50%{

        transform:
        translate(-20px,20px);

    }

    100%{

        transform:
        translate(0px,0px);

    }

}

/* ========================================================= */
/* SIDEBAR */
/* ========================================================= */

.sidebar{

    position:fixed;

    left:0;
    top:0;

    width:260px;

    height:100vh;

    background:
    rgba(15,23,42,.95);

    backdrop-filter:
    blur(18px);

    border-right:
    1px solid rgba(255,255,255,.08);

    padding:20px;

    display:flex;

    flex-direction:column;

    justify-content:space-between;

    z-index:999;
}

.sidebar-logo{

    font-size:34px;

    font-weight:900;

    margin-bottom:30px;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.sidebar-menu{

    display:flex;

    flex-direction:column;

    gap:12px;
}

.side-btn{

    width:100%;

    border:none;

    background:
    rgba(255,255,255,.05);

    color:white;

    padding:16px;

    border-radius:16px;

    text-align:left;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.side-btn:hover{

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;

    transform:
    translateX(6px);
}

.collapse-btn{

    width:100%;

    border:none;

    padding:16px;

    border-radius:16px;

    background:
    rgba(255,255,255,.06);

    color:white;

    font-size:22px;

    cursor:pointer;
}

.sidebar.collapsed{

    width:90px;
}

.sidebar.collapsed .side-btn{

    font-size:0;

    text-align:center;
}

.sidebar.collapsed .side-btn::first-letter{

    font-size:22px;
}

.sidebar.collapsed .sidebar-logo{

    font-size:22px;
}

/* ========================================================= */
/* MAIN */
/* ========================================================= */

.main{

    margin-left:280px;

    padding:20px;

    transition:.2s;
}

.sidebar.collapsed ~ .main{

    margin-left:110px;
}

/* ========================================================= */
/* TOPBAR */
/* ========================================================= */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:30px;
}

.logo{

    font-size:42px;

    font-weight:900;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.login-btn{

    border:none;

    padding:14px 20px;

    border-radius:16px;

    font-weight:700;

    cursor:pointer;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;
}

/* ========================================================= */
/* GRID */
/* ========================================================= */

.grid{

    display:grid;

    grid-template-columns:
    1.2fr .8fr;

    gap:20px;
}

/* ========================================================= */
/* CARD */
/* ========================================================= */

.card{

    background:
    rgba(255,255,255,.06);

    backdrop-filter:
    blur(24px);

    border:
    1px solid rgba(255,255,255,.08);

    border-radius:28px;

    padding:24px;

    box-shadow:
    0 0 50px rgba(0,255,174,.08);

    transition:.25s;
}

.card:hover{

    box-shadow:
    0 0 80px rgba(0,255,174,.16);

    transform:
    translateY(-2px);
}

/* ========================================================= */
/* BOARD */
/* ========================================================= */

.board{

    width:min(85vw,720px);

    height:min(85vw,720px);

    aspect-ratio:1/1;

    margin:auto;

    display:grid;

    grid-template-columns:
    repeat(8,1fr);

    grid-template-rows:
    repeat(8,1fr);

    border-radius:24px;

    overflow:hidden;

    border:
    5px solid rgba(255,255,255,.08);

    box-shadow:
    0 0 60px rgba(0,255,180,.18);
}

.square{

    position:relative;

    display:flex;

    justify-content:center;

    align-items:center;
}

.light{

    background:#f0d9b5;
}

.dark{

    background:#b58863;
}

.square:hover{

    filter:brightness(1.08);
}

/* ========================================================= */
/* PIECES */
/* ========================================================= */

.piece{

    width:82%;
    height:82%;

    object-fit:contain;

    cursor:grab;

    transition:.15s;

    filter:
    drop-shadow(
        0 0 4px rgba(0,0,0,.5)
    );
}

.piece:hover{

    transform:
    scale(1.08);
}

.selected{

    box-shadow:
    inset 0 0 0 5px #00ffae;
}

.move-dot::after{

    content:"";

    width:20px;
    height:20px;

    border-radius:50%;

    background:
    rgba(0,255,174,.7);

    position:absolute;
}

/* ========================================================= */
/* PROFILE */
/* ========================================================= */

.profile{

    display:flex;

    gap:18px;

    align-items:center;

    margin-bottom:20px;
}

.avatar{

    width:90px;
    height:90px;

    border-radius:50%;

    border:
    4px solid #00ffae;
}

.badge{

    display:inline-block;

    margin-top:10px;

    padding:8px 14px;

    border-radius:999px;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;

    font-weight:900;
}

.profile-status{

    margin-top:10px;

    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:8px 14px;

    border-radius:999px;

    background:
    rgba(0,255,174,.15);

    color:#00ffae;

    font-weight:700;

    border:
    1px solid rgba(0,255,174,.4);
}

/* ========================================================= */
/* STATS */
/* ========================================================= */

.stats{

    display:flex;

    gap:12px;

    margin-top:20px;
}

.stat{

    flex:1;

    background:
    rgba(255,255,255,.05);

    border-radius:18px;

    padding:16px;

    text-align:center;
}

.stat-value{

    margin-top:8px;

    font-size:30px;

    font-weight:900;
}

/* ========================================================= */
/* RESPONSIVE */
/* ========================================================= */

@media(max-width:1100px){

    .grid{

        grid-template-columns:
        1fr;
    }

}

@media(max-width:900px){

    .sidebar{

        width:90px;
    }

    .main{

        margin-left:110px;
    }

    .board{

        width:95vw;
        height:95vw;
    }

}

</style>
</head>
<body>

<!-- ========================================================= -->
<!-- SIDEBAR -->
<!-- ========================================================= -->

<div
id="sidebar"
class="sidebar">

    <div>

        <div class="sidebar-logo">

            ♟ NeonChess

        </div>

        <div class="sidebar-menu">

            <button class="side-btn">
                ▶ Play
            </button>

            <button class="side-btn">
                📚 Lesson
            </button>

            <button class="side-btn">
                🧩 Trainer
            </button>

            <button class="side-btn">
                📺 NeonChess TV
            </button>

            <button class="side-btn">
                🔍 Search Player
            </button>

            <button class="side-btn">
                👤 Account
            </button>

            <button class="side-btn">
                ⚙ Settings
            </button>

        </div>

    </div>

    <button
    class="collapse-btn"
    onclick="toggleSidebar()">

        ☰

    </button>

</div>

<!-- ========================================================= -->
<!-- MAIN -->
<!-- ========================================================= -->

<div class="main">

    <div class="topbar">

        <div class="logo">

            NeonChess

        </div>

        <button class="login-btn">

            🔐 Login

        </button>

    </div>

    <div class="grid">

        <!-- ================================================= -->
        <!-- BOARD -->
        <!-- ================================================= -->

        <div class="card">

            <h2>
                ♟ NeonChess Board
            </h2>

            <br>

            <div
            id="board"
            class="board"></div>

        </div>

        <!-- ================================================= -->
        <!-- PROFILE -->
        <!-- ================================================= -->

        <div class="card">

            <h2>
                👤 Profile
            </h2>

            <div class="profile">

                <img
                class="avatar"
                src="https://i.pravatar.cc/150?img=12">

                <div>

                    <h2>
                        HungCHESS_yt
                    </h2>

                    <p>
                        neonchess@gmail.com
                    </p>

                    <div class="profile-status">

                        🟢 Online

                    </div>

                    <div class="badge">

                        ADMIN SITE

                    </div>

                </div>

            </div>

            <div class="stats">

                <div class="stat">

                    🪙 Coin

                    <div class="stat-value">

                        500

                    </div>

                </div>

                <div class="stat">

                    🏆 ELO

                    <div class="stat-value">

                        1200

                    </div>

                </div>

                <div class="stat">

                    🔥 Streak

                    <div class="stat-value">

                        0

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- ========================================================= -->
<!-- SCRIPT -->
<!-- ========================================================= -->

<script type="module">

import { Chess } from
"https://cdn.jsdelivr.net/npm/chess.js@1.0.0-beta.6/+esm";

/* ========================================================= */
/* GAME */
/* ========================================================= */

const game =
new Chess();

let selectedSquare =
null;

/* ========================================================= */
/* PIECES */
/* ========================================================= */

const pieces = {

r:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/br.png",
n:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/bn.png",
b:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/bb.png",
q:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/bq.png",
k:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/bk.png",
p:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/bp.png",

R:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wr.png",
N:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wn.png",
B:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wb.png",
Q:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wq.png",
K:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wk.png",
P:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wp.png"

};

/* ========================================================= */
/* SIDEBAR */
/* ========================================================= */

window.toggleSidebar =
function(){

    document
    .getElementById(
        "sidebar"
    )
    .classList
    .toggle(
        "collapsed"
    );

}

/* ========================================================= */
/* DRAW */
/* ========================================================= */

function drawBoard(){

    const board =
    document.getElementById(
        "board"
    );

    board.innerHTML = "";

    const currentBoard =
    game.board();

    for(let y=0;y<8;y++){

        for(let x=0;x<8;x++){

            const square =
            document.createElement(
                "div"
            );

            square.className =
            "square " +
            (
                (x+y)%2===0
                ? "light"
                : "dark"
            );

            const file =
            "abcdefgh"[x];

            const rank =
            8-y;

            const squareName =
            file + rank;

            square.dataset.square =
            squareName;

            const piece =
            currentBoard[y][x];

            /* ================================================= */
            /* PIECE */
            /* ================================================= */

            if(piece){

                const code =
                piece.color === "w"
                ? piece.type.toUpperCase()
                : piece.type;

                const img =
                document.createElement(
                    "img"
                );

                img.src =
                pieces[code];

                img.className =
                "piece";

                img.draggable =
                true;

                /* ============================================= */
                /* DRAG START */
                /* ============================================= */

                img.ondragstart =
                (e)=>{

                    e.dataTransfer.setData(
                        "text",
                        squareName
                    );

                };

                square.appendChild(
                    img
                );

            }

            /* ================================================= */
            /* CLICK */
            /* ================================================= */

            square.onclick =
            ()=>{

                clickSquare(
                    squareName
                );

            };

            /* ================================================= */
            /* DRAG OVER */
            /* ================================================= */

            square.ondragover =
            (e)=>{

                e.preventDefault();

            };

            /* ================================================= */
            /* DROP */
            /* ================================================= */

            square.ondrop =
            (e)=>{

                e.preventDefault();

                const from =
                e.dataTransfer.getData(
                    "text"
                );

                const to =
                squareName;

                movePiece(
                    from,
                    to
                );

            };

            board.appendChild(
                square
            );

        }

    }

}

/* ========================================================= */
/* CLICK */
/* ========================================================= */

function clickSquare(square){

    /* ===================================================== */
    /* BỎ CHỌN */
    /* ===================================================== */

    if(selectedSquare === square){

        selectedSquare =
        null;

        drawBoard();

        return;
    }

    /* ===================================================== */
    /* CHƯA CHỌN */
    /* ===================================================== */

    if(!selectedSquare){

        const piece =
        game.get(square);

        if(!piece) return;

        if(piece.color !== game.turn())
        return;

        selectedSquare =
        square;

        drawBoard();

        highlightSquare(square);

        showMoves(square);

        return;
    }

    /* ===================================================== */
    /* ĐỔI QUÂN */
    /* ===================================================== */

    const clickedPiece =
    game.get(square);

    if(

        clickedPiece &&

        clickedPiece.color ===
        game.turn()

    ){

        selectedSquare =
        square;

        drawBoard();

        highlightSquare(square);

        showMoves(square);

        return;
    }

    /* ===================================================== */
    /* MOVE */
    /* ===================================================== */

    movePiece(
        selectedSquare,
        square
    );

}

/* ========================================================= */
/* MOVE */
/* ========================================================= */

function movePiece(from,to){

    const move =
    game.move({

        from:from,
        to:to,

        promotion:"q"

    });

    selectedSquare =
    null;

    drawBoard();

    if(move){

        console.log(
            move.san
        );

    }

}

/* ========================================================= */
/* HIGHLIGHT */
/* ========================================================= */

function highlightSquare(squareName){

    const square =
    document.querySelector(
        `[data-square="${squareName}"]`
    );

    if(square){

        square.classList.add(
            "selected"
        );

    }

}

/* ========================================================= */
/* SHOW MOVES */
/* ========================================================= */

function showMoves(square){

    const moves =
    game.moves({

        square:square,
        verbose:true

    });

    moves.forEach(move=>{

        const target =
        document.querySelector(
            `[data-square="${move.to}"]`
        );

        if(target){

            target.classList.add(
                "move-dot"
            );

        }

    });

}

/* ========================================================= */
/* START */
/* ========================================================= */

drawBoard();

console.log(
    "NeonChess Ready"
);

</script>

</body>
</html>
