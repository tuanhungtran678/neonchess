<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NeonChess Ultimate</title>

<style>

/* ========================= RESET ========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#0b1220;
    color:white;
    min-height:100vh;
}

/* ========================= LAYOUT ========================= */

.main{
    display:grid;
    grid-template-columns: 1.2fr .8fr;
    gap:20px;
    padding:20px;
}

/* ========================= HERO TIMER MODES ========================= */

.modes{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.mode{
    padding:10px 14px;
    border-radius:12px;
    background:#1b2a44;
    cursor:pointer;
}

.mode.active{
    background:#00ffae;
    color:#000;
    font-weight:bold;
}

/* ========================= BOARD ========================= */

.board{
    width:100%;
    aspect-ratio:1/1; /* FIX MÉO */
    display:grid;
    grid-template-columns:repeat(8,1fr);
    border:4px solid #222;
}

.square{
    width:100%;
    aspect-ratio:1/1; /* FIX 100% vuông */
    display:flex;
    justify-content:center;
    align-items:center;
}

.light{background:#f0d9b5;}
.dark{background:#b58863;}

.piece{
    width:80%;
    height:80%;
}

/* ========================= CHAT ========================= */

.chat{
    background:#111a2b;
    border-radius:12px;
    padding:10px;
    height:500px;
    display:flex;
    flex-direction:column;
}

.chat-box{
    flex:1;
    overflow:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.msg{
    background:#1c2b44;
    padding:8px;
    border-radius:10px;
    font-size:14px;
}

.time{
    font-size:10px;
    opacity:.6;
    margin-top:3px;
}

.input{
    display:flex;
    gap:8px;
}

input{
    flex:1;
    padding:10px;
    border-radius:8px;
    border:none;
}

button{
    padding:10px;
    border:none;
    background:#00ffae;
    font-weight:bold;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="main">

    <!-- ========================= LEFT ========================= -->
    <div>

        <!-- TIMER MODES -->
        <div class="modes">

            <div class="mode active" onclick="setMode(10)">⚡ 10s Bullet</div>
            <div class="mode" onclick="setMode(30)">🔥 30s Blitz</div>
            <div class="mode" onclick="setMode(300)">♟ 5m Rapid</div>
            <div class="mode" onclick="setMode(86400)">📅 Daily</div>

        </div>

        <!-- BOARD -->
        <div id="board" class="board"></div>

    </div>

    <!-- ========================= CHAT ========================= -->
    <div class="chat">

        <h3>💬 Realtime Chat</h3>

        <div id="chatBox" class="chat-box"></div>

        <div class="input">
            <input id="msgInput" placeholder="Nhập tin nhắn...">
            <button onclick="sendMsg()">Send</button>
        </div>

    </div>

</div>

<script>

/* ========================= TIMER ========================= */

let timeMode = 10;
let timeLeft = timeMode;

function setMode(sec){

    timeMode = sec;
    timeLeft = sec;

    document.querySelectorAll(".mode")
    .forEach(m=>m.classList.remove("active"));

    event.target.classList.add("active");
}

/* ========================= CHAT ========================= */

function timeNow(){

    const d = new Date();

    return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");

}

function sendMsg(){

    const input = document.getElementById("msgInput");

    const text = input.value;
    if(!text) return;

    const box = document.getElementById("chatBox");

    const msg = document.createElement("div");
    msg.className="msg";

    msg.innerHTML = `
        ${text}
        <div class="time">${timeNow()}</div>
    `;

    box.appendChild(msg);

    input.value="";

    box.scrollTop = box.scrollHeight;
}

/* ========================= FIX CHESS BOARD ========================= */

const board = document.getElementById("board");

const pieces = ["♜","♞","♝","♛","♚","♝","♞","♜"];

function draw(){

    board.innerHTML="";

    for(let y=0;y<8;y++){
        for(let x=0;x<8;x++){

            const sq = document.createElement("div");
            sq.className="square "+((x+y)%2?"dark":"light");

            if(y===0) sq.textContent = pieces[x];
            if(y===1) sq.textContent = "♟";

            if(y===6) sq.textContent = "♙";
            if(y===7) sq.textContent = pieces[x].toLowerCase();

            sq.style.fontSize="32px";

            board.appendChild(sq);
        }
    }
}

draw();

</script>

</body>
</html>
