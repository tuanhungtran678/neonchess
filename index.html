<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NeonChess Ultimate</title>

<link
rel="icon"
href="https://www.chess.com/bundles/web/images/favicon.7cca8c77.ico">

<style>

/* ========================================================= */
/* RESET */
/* ========================================================= */

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

    font-family:
    Arial,sans-serif;
}

body{

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #020617
    );

    color:white;

    min-height:100vh;

    overflow-x:hidden;
}

/* ========================================================= */
/* SIDEBAR */
/* ========================================================= */

.sidebar{

    position:fixed;

    left:0;
    top:0;

    width:260px;

    height:100vh;

    background:
    rgba(15,23,42,.96);

    backdrop-filter:
    blur(18px);

    border-right:
    1px solid rgba(255,255,255,.08);

    padding:20px;

    display:flex;

    flex-direction:column;

    justify-content:space-between;

    z-index:999;
}

.sidebar-logo{

    font-size:34px;

    font-weight:900;

    margin-bottom:30px;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.sidebar-menu{

    display:flex;

    flex-direction:column;

    gap:12px;
}

.side-btn{

    width:100%;

    background:
    rgba(255,255,255,.05);

    color:white;

    border:none;

    padding:16px;

    border-radius:16px;

    text-align:left;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.side-btn:hover{

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;

    transform:
    translateX(6px);
}

.collapse-btn{

    width:100%;

    background:
    rgba(255,255,255,.06);

    color:white;

    border:none;

    padding:16px;

    border-radius:16px;

    font-size:22px;

    cursor:pointer;
}

.sidebar.collapsed{

    width:90px;
}

.sidebar.collapsed .sidebar-logo{

    font-size:22px;
}

.sidebar.collapsed .side-btn{

    text-align:center;

    font-size:0;
}

.sidebar.collapsed .side-btn::first-letter{

    font-size:22px;
}

/* ========================================================= */
/* MAIN */
/* ========================================================= */

.main{

    margin-left:280px;

    padding:20px;

    transition:.2s;
}

.sidebar.collapsed ~ .main{

    margin-left:110px;
}

/* ========================================================= */
/* TOPBAR */
/* ========================================================= */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:30px;
}

.logo{

    font-size:42px;

    font-weight:900;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.top-buttons{

    display:flex;

    gap:12px;
}

button{

    border:none;

    padding:12px 18px;

    border-radius:14px;

    cursor:pointer;

    font-weight:700;

    transition:.2s;
}

button:hover{

    transform:
    scale(1.05);
}

.login-btn{

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;
}

.logout-btn{

    background:#ff4d4d;

    color:white;
}

/* ========================================================= */
/* GRID */
/* ========================================================= */

.grid{

    display:grid;

    grid-template-columns:
    1.2fr .8fr;

    gap:20px;
}

/* ========================================================= */
/* CARD */
/* ========================================================= */

.card{

    background:
    rgba(255,255,255,.06);

    backdrop-filter:
    blur(18px);

    border:
    1px solid rgba(255,255,255,.08);

    border-radius:24px;

    padding:24px;

    box-shadow:
    0 0 40px rgba(0,255,180,.12);
}

.card h2{

    margin-bottom:18px;

    font-size:28px;
}

/* ========================================================= */
/* CHESS */
/* ========================================================= */

.chess-card{

    grid-row:
    span 2;
}

.board-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:18px;
}

.status{

    color:#94a3b8;

    margin-top:6px;
}

.board-buttons{

    display:flex;

    gap:10px;
}

/* ========================================================= */
/* BOARD */
/* ========================================================= */

.board{

    width:min(85vw,720px);

    height:min(85vw,720px);

    aspect-ratio:1/1;

    margin:auto;

    display:grid;

    grid-template-columns:
    repeat(8,1fr);

    grid-template-rows:
    repeat(8,1fr);

    border-radius:24px;

    overflow:hidden;

    border:
    5px solid rgba(255,255,255,.08);

    box-shadow:
    0 0 60px rgba(0,255,180,.18);

    background:#222;
}

.square{

    width:100%;
    height:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    cursor:pointer;

    user-select:none;

    transition:.15s;

    position:relative;
}

.square:hover{

    filter:brightness(1.08);
}

.piece{

    width:82%;
    height:82%;

    object-fit:contain;

    pointer-events:none;

    filter:
    drop-shadow(
        0 0 4px rgba(0,0,0,.5)
    );

    transition:.15s;
}

.square:hover .piece{

    transform:
    scale(1.08);
}

.light{

    background:#f0d9b5;
}

.dark{

    background:#b58863;
}

.selected{

    box-shadow:
    inset 0 0 0 5px #00ffae;
}

.move-dot::after{

    content:"";

    width:20px;
    height:20px;

    border-radius:50%;

    background:
    rgba(0,255,174,.7);

    position:absolute;
}

/* ========================================================= */
/* PROFILE */
/* ========================================================= */

.profile{

    display:flex;

    align-items:center;

    gap:18px;

    margin-bottom:20px;
}

.avatar{

    width:90px;
    height:90px;

    border-radius:50%;

    border:
    4px solid #00ffae;

    box-shadow:
    0 0 25px rgba(0,255,174,.4);
}

.badge{

    display:inline-block;

    margin-top:8px;

    padding:8px 14px;

    border-radius:999px;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;

    font-weight:900;
}

/* ========================================================= */
/* STATS */
/* ========================================================= */

.stats{

    display:flex;

    gap:12px;

    margin-top:20px;
}

.stat{

    flex:1;

    background:
    rgba(255,255,255,.05);

    border-radius:18px;

    padding:16px;

    text-align:center;
}

.stat-value{

    font-size:30px;

    font-weight:900;

    margin-top:8px;
}

/* ========================================================= */
/* LEADERBOARD */
/* ========================================================= */

.leader-item{

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:
    rgba(255,255,255,.05);

    border-radius:14px;

    padding:14px;

    margin-top:12px;
}

/* ========================================================= */
/* MOBILE */
/* ========================================================= */

@media(max-width:1100px){

    .grid{

        grid-template-columns:
        1fr;
    }

}

@media(max-width:900px){

    .sidebar{

        width:90px;
    }

    .main{

        margin-left:110px;
    }

    .board{

        width:95vw;
        height:95vw;
    }

}

</style>
</head>
<body>

<!-- ========================================================= -->
<!-- SIDEBAR -->
<!-- ========================================================= -->

<div
id="sidebar"
class="sidebar">

    <div>

        <div class="sidebar-logo">

            ♟ NeonChess

        </div>

        <div class="sidebar-menu">

            <button class="side-btn">
                ▶ Play
            </button>

            <button class="side-btn">
                📚 Lesson
            </button>

            <button class="side-btn">
                🧩 Trainer
            </button>

            <button class="side-btn">
                📺 NeonChess TV
            </button>

            <button class="side-btn">
                🔍 Search Player
            </button>

            <button class="side-btn">
                👤 Account
            </button>

            <button class="side-btn">
                ⚙ Settings
            </button>

        </div>

    </div>

    <div>

        <button
        class="collapse-btn"
        onclick="toggleSidebar()">

            ☰

        </button>

    </div>

</div>

<!-- ========================================================= -->
<!-- MAIN -->
<!-- ========================================================= -->

<div class="main">

    <div class="topbar">

        <div class="logo">

            NeonChess

        </div>

        <div class="top-buttons">

            <button
            id="loginBtn"
            class="login-btn">

                🔐 Login

            </button>

            <button
            id="logoutBtn"
            class="logout-btn"
            style="display:none;">

                Logout

            </button>

        </div>

    </div>

    <div class="grid">

        <!-- BOARD -->

        <div class="card chess-card">

            <div class="board-top">

                <div>

                    <h2>♟ NeonChess Board</h2>

                    <p
                    class="status">

                        White to move

                    </p>

                </div>

                <div class="board-buttons">

                    <button
                    onclick="resetBoard()">

                        🔄 Reset

                    </button>

                </div>

            </div>

            <div
            id="board"
            class="board"></div>

        </div>

        <!-- PROFILE -->

        <div class="card">

            <h2>👤 Profile</h2>

            <div class="profile">

                <img
                id="avatar"
                class="avatar"
                src="https://i.pravatar.cc/150?img=12">

                <div>

                    <h2 id="name">
                        Guest
                    </h2>

                    <p id="email">
                        Not logged in
                    </p>

                    <div class="badge">

                        ADMIN SITE

                    </div>

                </div>

            </div>

            <div class="stats">

                <div class="stat">

                    🪙 Coin

                    <div
                    id="coin"
                    class="stat-value">

                        500

                    </div>

                </div>

                <div class="stat">

                    🏆 ELO

                    <div
                    id="elo"
                    class="stat-value">

                        1200

                    </div>

                </div>

                <div class="stat">

                    🔥 Streak

                    <div
                    id="streak"
                    class="stat-value">

                        0

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- ========================================================= -->
<!-- SCRIPT -->
<!-- ========================================================= -->

<script type="module">

/* ========================================================= */
/* CHESS JS */
/* ========================================================= */

import { Chess } from
"https://cdn.jsdelivr.net/npm/chess.js@1.0.0-beta.6/+esm";

/* ========================================================= */
/* FIREBASE */
/* ========================================================= */

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {

    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut

} from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {

    apiKey:
    "AIzaSyByZbESWCAXypIJKBUNIm6KDmcXWX7SMgk",

    authDomain:
    "neonchess-df7aa.firebaseapp.com",

    projectId:
    "neonchess-df7aa",

    storageBucket:
    "neonchess-df7aa.firebasestorage.app",

    messagingSenderId:
    "784833820179",

    appId:
    "1:784833820179:web:3613d907d2a5b321bff1e6"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const provider =
new GoogleAuthProvider();

/* ========================================================= */
/* LOGIN */
/* ========================================================= */

document
.getElementById("loginBtn")
.onclick = async()=>{

    const result =
    await signInWithPopup(
        auth,
        provider
    );

    console.log(result.user);

};

document
.getElementById("logoutBtn")
.onclick = async()=>{

    await signOut(auth);

};

/* ========================================================= */
/* AUTH */
/* ========================================================= */

onAuthStateChanged(auth,
(user)=>{

    if(user){

        document
        .getElementById(
            "loginBtn"
        )
        .style.display =
        "none";

        document
        .getElementById(
            "logoutBtn"
        )
        .style.display =
        "inline-block";

        document
        .getElementById(
            "name"
        )
        .textContent =
        user.displayName;

        document
        .getElementById(
            "email"
        )
        .textContent =
        user.email;

        document
        .getElementById(
            "avatar"
        )
        .src =
        user.photoURL;

    }

    else{

        document
        .getElementById(
            "loginBtn"
        )
        .style.display =
        "inline-block";

        document
        .getElementById(
            "logoutBtn"
        )
        .style.display =
        "none";

    }

});

/* ========================================================= */
/* SIDEBAR */
/* ========================================================= */

window.toggleSidebar =
function(){

    document
    .getElementById(
        "sidebar"
    )
    .classList
    .toggle(
        "collapsed"
    );

}

/* ========================================================= */
/* CHESS */
/* ========================================================= */

const game =
new Chess();

let selectedSquare =
null;

/* ========================================================= */
/* PIECES */
/* ========================================================= */

const pieces = {

r:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/br.png",
n:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/bn.png",
b:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/bb.png",
q:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/bq.png",
k:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/bk.png",
p:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/bp.png",

R:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wr.png",
N:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wn.png",
B:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wb.png",
Q:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wq.png",
K:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wk.png",
P:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wp.png"

};

/* ========================================================= */
/* DRAW */
/* ========================================================= */

function drawBoard(){

    const board =
    document.getElementById(
        "board"
    );

    board.innerHTML = "";

    const currentBoard =
    game.board();

    for(let y=0;y<8;y++){

        for(let x=0;x<8;x++){

            const square =
            document.createElement(
                "div"
            );

            square.className =
            "square " +
            (
                (x+y)%2==0
                ? "light"
                : "dark"
            );

            const file =
            "abcdefgh"[x];

            const rank =
            8-y;

            const squareName =
            file + rank;

            square.dataset.square =
            squareName;

            const piece =
            currentBoard[y][x];

            if(piece){

                const code =
                piece.color === "w"
                ? piece.type.toUpperCase()
                : piece.type;

                const img =
                document.createElement(
                    "img"
                );

                img.src =
                pieces[code];

                img.className =
                "piece";

                square.appendChild(
                    img
                );

            }

            square.onclick = ()=>{

                clickSquare(
                    squareName
                );

            };

            board.appendChild(
                square
            );

        }

    }

}

/* ========================================================= */
/* CLICK */
/* ========================================================= */

function clickSquare(square){

    if(!selectedSquare){

        const piece =
        game.get(square);

        if(!piece) return;

        if(piece.color !== game.turn())
        return;

        selectedSquare =
        square;

        drawBoard();

        highlightSquare(square);

        showMoves(square);

        return;
    }

    const move =
    game.move({

        from:selectedSquare,
        to:square,

        promotion:"q"

    });

    selectedSquare =
    null;

    drawBoard();

    if(move){

        updateStatus();

    }

}

/* ========================================================= */
/* HIGHLIGHT */
/* ========================================================= */

function highlightSquare(squareName){

    const square =
    document.querySelector(
        `[data-square="${squareName}"]`
    );

    if(square){

        square.classList.add(
            "selected"
        );

    }

}

/* ========================================================= */
/* SHOW MOVES */
/* ========================================================= */

function showMoves(square){

    const moves =
    game.moves({

        square:square,
        verbose:true

    });

    moves.forEach(move=>{

        const target =
        document.querySelector(
            `[data-square="${move.to}"]`
        );

        if(target){

            target.classList.add(
                "move-dot"
            );

        }

    });

}

/* ========================================================= */
/* STATUS */
/* ========================================================= */

function updateStatus(){

    const status =
    document.querySelector(
        ".status"
    );

    if(game.inCheckmate()){

        status.textContent =
        game.turn()==="w"
        ? "Black wins!"
        : "White wins!";

        return;
    }

    if(game.inDraw()){

        status.textContent =
        "Draw";

        return;
    }

    if(game.inCheck()){

        status.textContent =
        game.turn()==="w"
        ? "White in check"
        : "Black in check";

        return;
    }

    status.textContent =
    game.turn()==="w"
    ? "White to move"
    : "Black to move";

}

/* ========================================================= */
/* RESET */
/* ========================================================= */

window.resetBoard =
function(){

    game.reset();

    selectedSquare =
    null;

    drawBoard();

    updateStatus();

}

/* ========================================================= */
/* START */
/* ========================================================= */

drawBoard();

updateStatus();

console.log(
    "NeonChess Ready"
);

</script>

</body>
</html>
