<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NeonChess</title>

<link
rel="icon"
href="https://www.chess.com/bundles/web/images/icons/favicon.ico">

<style>

/* ========================================================= */
/* RESET */
/* ========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
    "Segoe UI",
    sans-serif;
}

body{

    background:
    linear-gradient(
        135deg,
        #030712,
        #0b1120,
        #111827
    );

    color:white;

    overflow-x:hidden;
}

/* ========================================================= */
/* BACKGROUND */
/* ========================================================= */

.bg{

    position:fixed;

    inset:0;

    z-index:-1;

    overflow:hidden;
}

.glow{

    position:absolute;

    border-radius:50%;

    filter:blur(120px);

    opacity:.22;
}

.glow1{

    width:520px;
    height:520px;

    background:#00ffae;

    top:-150px;
    left:-150px;
}

.glow2{

    width:520px;
    height:520px;

    background:#00c3ff;

    right:-150px;
    bottom:-150px;
}

/* ========================================================= */
/* LAYOUT */
/* ========================================================= */

.container{

    display:grid;

    grid-template-columns:
    290px 1fr;

    min-height:100vh;
}

/* ========================================================= */
/* SIDEBAR */
/* ========================================================= */

.sidebar{

    background:
    rgba(255,255,255,.03);

    border-right:
    1px solid rgba(255,255,255,.06);

    backdrop-filter:
    blur(24px);

    padding:24px;

    display:flex;

    flex-direction:column;
}

.logo{

    font-size:42px;

    font-weight:900;

    margin-bottom:36px;
}

.menu{

    display:flex;

    flex-direction:column;

    gap:14px;
}

.menu button{

    border:none;

    padding:18px;

    border-radius:22px;

    background:
    rgba(255,255,255,.04);

    color:white;

    font-size:17px;

    font-weight:800;

    text-align:left;

    cursor:pointer;

    transition:.2s;
}

.menu button:hover{

    transform:
    translateX(8px);

    background:
    linear-gradient(
        90deg,
        rgba(0,255,174,.18),
        rgba(0,195,255,.18)
    );
}

/* ========================================================= */
/* MAIN */
/* ========================================================= */

.main{

    padding:24px;
}

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:24px;
}

.title{

    font-size:58px;

    font-weight:900;
}

.subtitle{

    color:#9ca3af;
}

.login-btn{

    border:none;

    padding:16px 24px;

    border-radius:18px;

    font-weight:900;

    cursor:pointer;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;
}

/* ========================================================= */
/* HERO */
/* ========================================================= */

.hero{

    position:relative;

    overflow:hidden;

    padding:44px;

    border-radius:34px;

    margin-bottom:24px;

    background:
    linear-gradient(
        135deg,
        rgba(255,255,255,.05),
        rgba(255,255,255,.02)
    );

    border:
    1px solid rgba(255,255,255,.08);
}

.hero::before{

    content:"";

    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    background:
    radial-gradient(
        rgba(0,255,174,.2),
        transparent 70%
    );

    top:-180px;
    right:-180px;
}

.hero h1{

    font-size:74px;

    line-height:1.05;

    margin-bottom:18px;
}

.hero span{

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

/* ========================================================= */
/* CONTENT */
/* ========================================================= */

.content{

    display:grid;

    grid-template-columns:
    1fr 340px;

    gap:24px;
}

.card{

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,.05),
        rgba(255,255,255,.03)
    );

    border:
    1px solid rgba(255,255,255,.08);

    border-radius:34px;

    padding:24px;

    backdrop-filter:
    blur(24px);
}

/* ========================================================= */
/* BOARD */
/* ========================================================= */

.board-wrapper{

    position:relative;

    width:min(82vw,720px);

    margin:auto;
}

#arrowLayer{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

    z-index:5;
}

.board{

    width:100%;

    aspect-ratio:1/1;

    display:grid;

    grid-template-columns:
    repeat(8,1fr);

    overflow:hidden;

    border-radius:22px;

    box-shadow:
    0 0 40px rgba(0,255,174,.18);
}

.square{

    aspect-ratio:1/1;

    display:flex;

    justify-content:center;

    align-items:center;

    position:relative;
}

.light{
    background:#f0d9b5;
}

.dark{
    background:#b58863;
}

.selected{

    box-shadow:
    inset 0 0 0 5px #00ffae;
}

.move::after{

    content:"";

    width:18px;
    height:18px;

    border-radius:50%;

    background:
    rgba(0,255,174,.75);

    position:absolute;
}

.piece{

    width:78%;
    height:78%;

    object-fit:contain;

    cursor:grab;

    transition:.12s;

    user-select:none;

    -webkit-user-drag:none;

    z-index:2;
}

.piece:hover{

    transform:scale(1.08);
}

/* ========================================================= */
/* ACTIONS */
/* ========================================================= */

.actions{

    display:flex;

    gap:12px;

    flex-wrap:wrap;

    margin-top:22px;
}

.actions button{

    border:none;

    padding:14px 18px;

    border-radius:16px;

    font-weight:900;

    cursor:pointer;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;
}

/* ========================================================= */
/* PROFILE */
/* ========================================================= */

.profile{

    text-align:center;
}

.avatar{

    width:120px;
    height:120px;

    border-radius:50%;

    border:
    4px solid #00ffae;

    margin-bottom:18px;
}

.badge{

    display:inline-block;

    margin-top:14px;

    padding:8px 14px;

    border-radius:999px;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;

    font-weight:900;
}

.history{

    margin-top:24px;

    padding:16px;

    border-radius:18px;

    background:
    rgba(255,255,255,.05);

    max-height:220px;

    overflow:auto;
}

/* ========================================================= */
/* LAYER */
/* ========================================================= */

.layer{

    padding:16px;

    border-radius:18px;

    margin-bottom:14px;

    background:
    rgba(255,255,255,.05);

    font-weight:800;

    transition:.2s;

    cursor:pointer;
}

.layer:hover{

    transform:
    translateX(6px);

    background:
    rgba(0,255,174,.15);
}

/* ========================================================= */
/* MOBILE */
/* ========================================================= */

@media(max-width:1100px){

    .container{

        grid-template-columns:
        1fr;
    }

    .sidebar{

        display:none;
    }

    .content{

        grid-template-columns:
        1fr;
    }

}

</style>
</head>
<body>

<div class="bg">

    <div class="glow glow1"></div>

    <div class="glow glow2"></div>

</div>

<div class="container">

    <!-- ================================================= -->
    <!-- SIDEBAR -->
    <!-- ================================================= -->

    <div class="sidebar">

        <div class="logo">
            ♟ NeonChess
        </div>

        <div class="menu">

            <button onclick="startBullet()">
                ⚡ Bullet
            </button>

            <button onclick="startBlitz()">
                🔥 Blitz
            </button>

            <button onclick="startRapid()">
                🧠 Rapid
            </button>

            <button onclick="startMultiplayer()">
                🌍 Multiplayer
            </button>

            <button onclick="startPuzzle()">
                🧩 Puzzle
            </button>

            <button onclick="playVsAI()">
                🤖 Play vs AI
            </button>

            <button onclick="openTrainer()">
                🎯 Trainer
            </button>

            <button onclick="openEditor()">
                🎬 Edit Video
            </button>

        </div>

    </div>

    <!-- ================================================= -->
    <!-- MAIN -->
    <!-- ================================================= -->

    <div class="main">

        <div class="topbar">

            <div>

                <div class="title">
                    NeonChess
                </div>

                <div class="subtitle">
                    PS5 Style Chess Experience
                </div>

            </div>

            <button
            class="login-btn"
            id="loginBtn">

                🔐 Login Google

            </button>

        </div>

        <div class="hero">

            <h1>

                Play Chess
                Like a
                <span>PS5 Game</span>

            </h1>

        </div>

        <div class="content">

            <!-- ========================================= -->
            <!-- BOARD -->
            <!-- ========================================= -->

            <div class="card">

                <div class="board-wrapper">

                    <svg
                    id="arrowLayer"></svg>

                    <div
                    id="board"
                    class="board"></div>

                </div>

                <div class="actions">

                    <button onclick="newGame()">
                        ♻ New Game
                    </button>

                    <button onclick="showBestMove()">
                        🤖 Best Move
                    </button>

                </div>

                <div class="history">

                    <b>📜 Match History</b>

                    <div id="moves"></div>

                </div>

            </div>

            <!-- ========================================= -->
            <!-- PROFILE -->
            <!-- ========================================= -->

            <div class="card">

                <div class="profile">

                    <img
                    id="avatar"
                    class="avatar"
                    src="https://i.pravatar.cc/200">

                    <h2 id="username">
                        Guest 🇻🇳
                    </h2>

                    <p id="email">
                        Not logged in
                    </p>

                    <div class="badge">
                        ADMIN SITE
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- ===================================================== -->
<!-- VIDEO EDITOR -->
<!-- ===================================================== -->

<div
id="editorModal"

style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.82);
backdrop-filter:blur(18px);
z-index:9999;
justify-content:center;
align-items:center;
padding:30px;
">

<div

style="
width:95%;
height:92%;
background:#0b1220;
border-radius:30px;
overflow:hidden;
display:grid;
grid-template-columns:1fr 320px;
grid-template-rows:1fr 220px;
gap:2px;
box-shadow:0 0 50px rgba(0,255,174,.2);
"

>

<!-- PREVIEW -->

<div

style="
background:#111827;
display:flex;
justify-content:center;
align-items:center;
position:relative;
"

>

<div

style="
width:420px;
height:420px;
border-radius:20px;
overflow:hidden;
box-shadow:0 0 30px rgba(0,255,174,.25);
background:#000;
display:flex;
justify-content:center;
align-items:center;
"

>

<div
id="miniBoard"

style="
width:100%;
height:100%;
display:grid;
grid-template-columns:repeat(8,1fr);
"

></div>

</div>

<button

onclick="
document.getElementById(
'editorModal'
).style.display='none'
"

style="
position:absolute;
top:20px;
right:20px;
border:none;
padding:12px 18px;
border-radius:14px;
background:#ef4444;
color:white;
font-weight:900;
cursor:pointer;
"

>

✕ Close

</button>

</div>

<!-- LAYERS -->

<div

style="
background:#0f172a;
padding:20px;
overflow:auto;
"

>

<h2
style="
margin-bottom:18px;
"
>

🎬 Layers

</h2>

<div class="layer">
🎵 Audio Track
</div>

<div class="layer">
🖼 Overlay Image
</div>

<div class="layer">
♟ Chess Board
</div>

<div class="layer">
✨ Neon Effect
</div>

<div class="layer">
📝 Subtitle
</div>

</div>

<!-- TIMELINE -->

<div

style="
grid-column:1/3;
background:#111827;
padding:20px;
"

>

<div

style="
margin-bottom:16px;
font-weight:900;
"

>

⏱ Timeline

</div>

<div

style="
height:90px;
background:#1f2937;
border-radius:18px;
position:relative;
overflow:hidden;
"

>

<div

style="
position:absolute;
left:0;
top:18px;
height:24px;
width:65%;
background:linear-gradient(
90deg,
#00ffae,
#00c3ff
);
border-radius:12px;
"

></div>

<div

style="
position:absolute;
left:0;
bottom:18px;
height:24px;
width:40%;
background:#8b5cf6;
border-radius:12px;
"

></div>

<div

style="
position:absolute;
left:58%;
top:0;
width:4px;
height:100%;
background:white;
box-shadow:0 0 12px white;
"

></div>

</div>

</div>

</div>

<script type="module">

import { Chess }
from
"https://cdn.jsdelivr.net/npm/chess.js@1.0.0-beta.6/+esm";

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {

getAuth,
GoogleAuthProvider,
signInWithPopup,
signOut,
onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

/* ========================================================= */
/* FIREBASE */
/* ========================================================= */

const firebaseConfig = {

apiKey:
"AIzaSyByZbESWCAXypIJKBUNIm6KDmcXWX7SMgk",

authDomain:
"neonchess-df7aa.firebaseapp.com",

databaseURL:
"https://neonchess-df7aa-default-rtdb.firebaseio.com",

projectId:
"neonchess-df7aa",

storageBucket:
"neonchess-df7aa.firebasestorage.app",

messagingSenderId:
"784833820179",

appId:
"1:784833820179:web:3613d907d2a5b321bff1e6",

measurementId:
"G-LBDENJ65N7"

};

const app =
initializeApp(
firebaseConfig
);

const auth =
getAuth(app);

const provider =
new GoogleAuthProvider();

/* ========================================================= */
/* LOGIN */
/* ========================================================= */

const loginBtn =
document.getElementById(
"loginBtn"
);

loginBtn.onclick =
()=>{

signInWithPopup(
auth,
provider
);

};

onAuthStateChanged(

auth,

(user)=>{

if(user){

document.getElementById(
"username"
).textContent =
user.displayName + " 🇻🇳";

document.getElementById(
"email"
).textContent =
user.email;

document.getElementById(
"avatar"
).src =
user.photoURL;

loginBtn.innerHTML =
"🚪 Logout";

loginBtn.onclick =
()=>{

signOut(auth);

};

}

}

/* ========================================================= */
/* OPEN EDITOR */
/* ========================================================= */

window.openEditor =
()=>{

document.getElementById(
"editorModal"
).style.display =
"flex";

};

</script>

</body>
</html>
