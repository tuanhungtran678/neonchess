<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NeonChess</title>

<style>

/* ========================================================= */
/* RESET */
/* ========================================================= */

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

    font-family:
    "Segoe UI",
    sans-serif;
}

body{

    background:
    linear-gradient(
        135deg,
        #020617,
        #0f172a,
        #111827
    );

    color:white;

    overflow-x:hidden;
}

/* ========================================================= */
/* BACKGROUND */
/* ========================================================= */

.bg{

    position:fixed;

    inset:0;

    z-index:-1;

    overflow:hidden;
}

.glow{

    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    filter:blur(120px);

    opacity:.18;
}

.glow1{

    background:#00ffae;

    top:-100px;
    left:-100px;
}

.glow2{

    background:#00c3ff;

    right:-100px;
    bottom:-100px;
}

/* ========================================================= */
/* LAYOUT */
/* ========================================================= */

.container{

    display:grid;

    grid-template-columns:
    260px 1fr;

    min-height:100vh;
}

/* ========================================================= */
/* SIDEBAR */
/* ========================================================= */

.sidebar{

    background:
    rgba(255,255,255,.05);

    border-right:
    1px solid rgba(255,255,255,.08);

    backdrop-filter:
    blur(20px);

    padding:22px;
}

.logo{

    font-size:34px;

    font-weight:900;

    margin-bottom:30px;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.menu{

    display:flex;

    flex-direction:column;

    gap:12px;
}

.menu button{

    border:none;

    background:
    rgba(255,255,255,.06);

    color:white;

    padding:16px;

    border-radius:18px;

    text-align:left;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.menu button:hover{

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;

    transform:
    translateX(6px);
}

/* ========================================================= */
/* MAIN */
/* ========================================================= */

.main{

    padding:24px;
}

/* ========================================================= */
/* TOPBAR */
/* ========================================================= */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:24px;
}

.title{

    font-size:46px;

    font-weight:900;
}

.login-btn{

    border:none;

    padding:14px 20px;

    border-radius:18px;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;

    font-weight:900;

    cursor:pointer;
}

/* ========================================================= */
/* HERO */
/* ========================================================= */

.hero{

    background:
    linear-gradient(
        135deg,
        rgba(0,255,174,.12),
        rgba(0,195,255,.08)
    );

    border:
    1px solid rgba(255,255,255,.08);

    border-radius:32px;

    padding:34px;

    margin-bottom:24px;

    backdrop-filter:
    blur(24px);
}

.hero h1{

    font-size:62px;

    line-height:1.05;

    margin-bottom:16px;
}

.hero span{

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.hero p{

    color:#cbd5e1;

    line-height:1.7;

    font-size:19px;
}

/* ========================================================= */
/* CONTENT */
/* ========================================================= */

.content{

    display:grid;

    grid-template-columns:
    1fr 340px;

    gap:22px;
}

/* ========================================================= */
/* CARD */
/* ========================================================= */

.card{

    background:
    rgba(255,255,255,.05);

    border:
    1px solid rgba(255,255,255,.08);

    border-radius:28px;

    padding:24px;

    backdrop-filter:
    blur(24px);
}

/* ========================================================= */
/* BOARD AREA */
/* ========================================================= */

.board-wrap{

    display:flex;

    gap:18px;

    justify-content:center;

    align-items:center;
}

.eval-bar{

    width:18px;

    height:min(82vw,720px);

    background:#111;

    border-radius:999px;

    overflow:hidden;

    position:relative;
}

.eval-fill{

    position:absolute;

    bottom:0;

    width:100%;

    height:50%;

    background:white;

    transition:.3s;
}

/* ========================================================= */
/* BOARD */
/* ========================================================= */

.board{

    width:min(82vw,720px);

    aspect-ratio:1/1;

    display:grid;

    grid-template-columns:
    repeat(8,1fr);

    border-radius:22px;

    overflow:hidden;

    box-shadow:
    0 0 40px rgba(0,255,174,.18);
}

.square{

    aspect-ratio:1/1;

    display:flex;

    justify-content:center;

    align-items:center;

    position:relative;

    transition:.12s;
}

.light{

    background:#f0d9b5;
}

.dark{

    background:#b58863;
}

.square:hover{

    filter:brightness(1.05);
}

.selected{

    box-shadow:
    inset 0 0 0 5px #00ffae;
}

.move::after{

    content:"";

    width:18px;
    height:18px;

    border-radius:50%;

    background:
    rgba(0,255,174,.72);

    position:absolute;
}

.last-move{

    box-shadow:
    inset 0 0 0 5px rgba(255,255,0,.45);
}

.check{

    background:
    #ff4d4d !important;
}

.piece{

    width:78%;

    height:78%;

    object-fit:contain;

    cursor:grab;

    user-select:none;

    -webkit-user-drag:none;

    transition:
    transform .12s;
}

.piece:hover{

    transform:
    scale(1.08);
}

/* ========================================================= */
/* BUTTONS */
/* ========================================================= */

.god-buttons{

    display:flex;

    gap:12px;

    flex-wrap:wrap;

    margin-top:22px;
}

.god-buttons button{

    border:none;

    padding:14px 18px;

    border-radius:16px;

    font-weight:900;

    cursor:pointer;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;
}

/* ========================================================= */
/* HISTORY */
/* ========================================================= */

.history{

    margin-top:22px;

    background:
    rgba(255,255,255,.05);

    border-radius:18px;

    padding:16px;

    max-height:180px;

    overflow:auto;
}

/* ========================================================= */
/* PROFILE */
/* ========================================================= */

.profile{

    text-align:center;
}

.avatar{

    width:110px;
    height:110px;

    border-radius:50%;

    border:
    4px solid #00ffae;

    margin-bottom:16px;
}

.badge{

    display:inline-block;

    margin-top:10px;

    padding:8px 14px;

    border-radius:999px;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;

    font-weight:900;
}

.stats{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:12px;

    margin-top:22px;
}

.stat{

    background:
    rgba(255,255,255,.05);

    border-radius:18px;

    padding:14px;
}

.stat-value{

    font-size:28px;

    font-weight:900;

    margin-top:8px;
}

/* ========================================================= */
/* MOBILE */
/* ========================================================= */

@media(max-width:1100px){

    .container{

        grid-template-columns:
        1fr;
    }

    .sidebar{

        display:none;
    }

    .content{

        grid-template-columns:
        1fr;
    }

    .hero h1{

        font-size:42px;
    }

}

</style>
</head>
<body>

<div class="bg">

    <div class="glow glow1"></div>

    <div class="glow glow2"></div>

</div>

<div class="container">

    <!-- ===================================================== -->
    <!-- SIDEBAR -->
    <!-- ===================================================== -->

    <div class="sidebar">

        <div class="logo">

            ♟ NeonChess

        </div>

        <div class="menu">

            <button onclick="startBullet()">
                ⚡ Bullet
            </button>

            <button onclick="startBlitz()">
                🔥 Blitz
            </button>

            <button onclick="startRapid()">
                🧠 Rapid
            </button>

            <button onclick="startMultiplayer()">
                🌍 Multiplayer
            </button>

            <button onclick="startPuzzle()">
                🧩 Puzzle Rush
            </button>

            <button onclick="playVsAI()">
                🤖 Play vs AI
            </button>

        </div>

    </div>

    <!-- ===================================================== -->
    <!-- MAIN -->
    <!-- ===================================================== -->

    <div class="main">

        <div class="topbar">

            <div class="title">

                NeonChess

            </div>

            <button
            class="login-btn"
            id="loginBtn">

                🔐 Login Google

            </button>

        </div>

        <div class="hero">

            <h1>

                Play Chess
                <span>Like PS5</span>

            </h1>

            <p>

                Neon gaming UI,
                AI engine,
                realtime multiplayer,
                Puzzle Rush,
                cloud profiles
                and advanced analysis.

            </p>

        </div>

        <div class="content">

            <!-- ================================================= -->
            <!-- BOARD -->
            <!-- ================================================= -->

            <div class="card">

                <div class="board-wrap">

                    <div class="eval-bar">

                        <div
                        id="evalFill"
                        class="eval-fill"></div>

                    </div>

                    <div
                    id="board"
                    class="board"></div>

                </div>

                <div class="god-buttons">

                    <button onclick="newGame()">
                        ♻ New Game
                    </button>

                    <button onclick="toggleFlip()">
                        🔄 Flip
                    </button>

                    <button onclick="analyzeGame()">
                        🧠 Analyze
                    </button>

                </div>

                <div class="history">

                    <b>📜 Move History</b>

                    <div id="moves"></div>

                </div>

            </div>

            <!-- ================================================= -->
            <!-- PROFILE -->
            <!-- ================================================= -->

            <div class="card">

                <div class="profile">

                    <img
                    id="avatar"
                    class="avatar"
                    src="https://i.pravatar.cc/200">

                    <h2
                    id="username"
                    style="
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    gap:10px;
                    ">

                        Guest

                        <img
                        id="flag"
                        src="https://flagcdn.com/w40/vn.png"
                        style="
                        width:32px;
                        border-radius:4px;
                        ">

                    </h2>

                    <p id="email">

                        Not logged in

                    </p>

                    <div class="badge">

                        ADMIN SITE

                    </div>

                    <div class="stats">

                        <div class="stat">

                            🪙

                            <div class="stat-value">

                                500

                            </div>

                        </div>

                        <div class="stat">

                            🏆

                            <div class="stat-value">

                                1200

                            </div>

                        </div>

                        <div class="stat">

                            🔥

                            <div class="stat-value">

                                0

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- ===================================================== -->
<!-- AUDIO -->
<!-- ===================================================== -->

<audio
id="moveSound"
src="https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move-self.mp3">
</audio>

<audio
id="captureSound"
src="https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/capture.mp3">
</audio>

<audio
id="checkSound"
src="https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move-check.mp3">
</audio>

<script type="module">

/* ========================================================= */
/* CHESS */
/* ========================================================= */

import { Chess }
from
"https://cdn.jsdelivr.net/npm/chess.js@1.0.0-beta.6/+esm";

/* ========================================================= */
/* FIREBASE */
/* ========================================================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {

getAuth,
GoogleAuthProvider,
signInWithPopup,
signOut,
onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

/* ========================================================= */
/* FIREBASE CONFIG */
/* ========================================================= */

const firebaseConfig = {

apiKey:
"AIzaSyByZbESWCAXypIJKBUNIm6KDmcXWX7SMgk",

authDomain:
"neonchess-df7aa.firebaseapp.com",

databaseURL:
"https://neonchess-df7aa-default-rtdb.firebaseio.com",

projectId:
"neonchess-df7aa",

storageBucket:
"neonchess-df7aa.firebasestorage.app",

messagingSenderId:
"784833820179",

appId:
"1:784833820179:web:3613d907d2a5b321bff1e6",

measurementId:
"G-LBDENJ65N7"

};

const app =
initializeApp(
firebaseConfig
);

const auth =
getAuth(app);

const provider =
new GoogleAuthProvider();

/* ========================================================= */
/* LOGIN */
/* ========================================================= */

const loginBtn =
document.getElementById(
"loginBtn"
);

loginBtn.onclick =
()=>{

signInWithPopup(
auth,
provider
);

};

onAuthStateChanged(

auth,

(user)=>{

if(user){

document.getElementById(
"username"
).childNodes[0].textContent =
user.displayName + " ";

document.getElementById(
"email"
).textContent =
user.email;

document.getElementById(
"avatar"
).src =
user.photoURL;

loginBtn.innerHTML =
"🚪 Logout";

loginBtn.onclick =
()=>signOut(auth);

}

else{

loginBtn.innerHTML =
"🔐 Login Google";

loginBtn.onclick =
()=>{

signInWithPopup(
auth,
provider
);

};

}

}

);

/* ========================================================= */
/* GAME */
/* ========================================================= */

const game =
new Chess();

let selected =
null;

let flipped =
false;

let aiMode =
false;

let lastMove =
null;

/* ========================================================= */
/* STOCKFISH */
/* ========================================================= */

const stockfish =
new Worker(
"https://cdn.jsdelivr.net/npm/stockfish@16.0.0/src/stockfish-nnue-16-single.js"
);

/* ========================================================= */
/* PIECES */
/* ========================================================= */

const pieces = {

r:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/br.png",
n:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bn.png",
b:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bb.png",
q:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bq.png",
k:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bk.png",
p:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bp.png",

R:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wr.png",
N:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wn.png",
B:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wb.png",
Q:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wq.png",
K:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wk.png",
P:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wp.png"

};

/* ========================================================= */
/* DRAW */
/* ========================================================= */

function drawBoard(){

const board =
document.getElementById(
"board"
);

board.innerHTML =
"";

const current =
game.board();

for(
let yy=0;
yy<8;
yy++
){

const y =
flipped
? 7-yy
: yy;

for(
let xx=0;
xx<8;
xx++
){

const x =
flipped
? 7-xx
: xx;

const sq =
document.createElement(
"div"
);

sq.className =
"square " +
(
(x+y)%2===0
? "light"
: "dark"
);

const file =
"abcdefgh"[x];

const rank =
8-y;

const name =
file + rank;

sq.dataset.square =
name;

if(
lastMove &&
(
name===lastMove.from ||
name===lastMove.to
)
){

sq.classList.add(
"last-move"
);

}

const piece =
current[y][x];

if(piece){

const code =
piece.color==="w"
? piece.type.toUpperCase()
: piece.type;

const img =
document.createElement(
"img"
);

img.src =
pieces[code];

img.className =
"piece";

img.draggable =
true;

img.addEventListener(
"dragstart",
()=>{

selected =
name;

}
);

sq.appendChild(
img
);

}

/* ===================================================== */
/* CLICK */
/* ===================================================== */

sq.onclick =
()=>{

if(selected===name){

selected =
null;

drawBoard();

return;

}

if(selected){

const move =
game.move({

from:selected,
to:name,
promotion:"q"

});

if(move){

lastMove =
move;

if(move.captured){

document.getElementById(
"captureSound"
).play();

}
else{

document.getElementById(
"moveSound"
).play();

}

selected =
null;

drawBoard();

updateHistory();

highlightCheck();

setTimeout(
aiMove,
250
);

return;

}

}

const p =
game.get(name);

if(p){

selected =
name;

drawBoard();

highlight(name);

showMoves(name);

}

};

sq.addEventListener(

"dragover",

(e)=>{

e.preventDefault();

}

);

sq.addEventListener(

"drop",

()=>{

if(!selected)return;

const move =
game.move({

from:selected,
to:name,
promotion:"q"

});

if(move){

lastMove =
move;

drawBoard();

updateHistory();

highlightCheck();

setTimeout(
aiMove,
250
);

}

selected =
null;

}

);

board.appendChild(
sq
);

}

}

}

/* ========================================================= */
/* HIGHLIGHT */
/* ========================================================= */

function highlight(name){

const sq =
document.querySelector(
`[data-square="${name}"]`
);

if(sq){

sq.classList.add(
"selected"
);

}

}

/* ========================================================= */
/* SHOW MOVES */
/* ========================================================= */

function showMoves(square){

const moves =
game.moves({

square:square,
verbose:true

});

moves.forEach(move=>{

const sq =
document.querySelector(
`[data-square="${move.to}"]`
);

if(sq){

sq.classList.add(
"move"
);

}

});

}

/* ========================================================= */
/* CHECK */
/* ========================================================= */

function highlightCheck(){

document
.querySelectorAll(
".check"
)
.forEach(el=>{

el.classList.remove(
"check"
);

});

if(game.inCheck()){

document.getElementById(
"checkSound"
).play();

const turn =
game.turn();

const board =
game.board();

for(let y=0;y<8;y++){

for(let x=0;x<8;x++){

const p =
board[y][x];

if(
p &&
p.type==="k" &&
p.color===turn
){

const sq =
"abcdefgh"[x] + (8-y);

const el =
document.querySelector(
`[data-square="${sq}"]`
);

if(el){

el.classList.add(
"check"
);

}

}

}

}

}

}

/* ========================================================= */
/* HISTORY */
/* ========================================================= */

function updateHistory(){

document.getElementById(
"moves"
).innerHTML =
game.history().join(" ");

}

/* ========================================================= */
/* AI */
/* ========================================================= */

window.playVsAI =
()=>{

aiMode =
true;

alert(
"🤖 AI enabled"
);

};

function aiMove(){

if(!aiMode)return;

stockfish.postMessage(
"position fen " + game.fen()
);

stockfish.postMessage(
"go depth 10"
);

}

stockfish.onmessage =
(event)=>{

const line =
event.data;

if(
line.includes("score cp")
){

const match =
line.match(
/score cp (-?\d+)/
);

if(match){

let val =
parseInt(
match[1]
);

val =
Math.max(
-1000,
Math.min(
1000,
val
)
);

const percent =
50 + val/20;

document.getElementById(
"evalFill"
).style.height =
percent + "%";

}

}

if(
line.startsWith(
"bestmove"
)
){

const move =
line.split(" ")[1];

if(
move &&
move!=="(none)"
){

game.move({

from:move.slice(0,2),
to:move.slice(2,4),
promotion:"q"

});

document.getElementById(
"moveSound"
).play();

drawBoard();

updateHistory();

highlightCheck();

}

}

};

/* ========================================================= */
/* BUTTONS */
/* ========================================================= */

window.newGame =
()=>{

game.reset();

drawBoard();

updateHistory();

};

window.toggleFlip =
()=>{

flipped =
!flipped;

drawBoard();

};

window.analyzeGame =
()=>{

stockfish.postMessage(
"position fen " + game.fen()
);

stockfish.postMessage(
"go depth 12"
);

};

window.startBullet =
()=>{

alert(
"⚡ Bullet 1+0"
);

};

window.startBlitz =
()=>{

alert(
"🔥 Blitz 3+2"
);

};

window.startRapid =
()=>{

alert(
"🧠 Rapid 10m"
);

};

window.startMultiplayer =
()=>{

alert(
"🌍 Multiplayer coming soon"
);

};

window.startPuzzle =
()=>{

game.load(
"8/8/8/8/4k3/8/3Q4/4K3 w - - 0 1"
);

drawBoard();

};

/* ========================================================= */
/* START */
/* ========================================================= */

drawBoard();

</script>

</body>
</html>
