<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeonChess TBM</title>

<style>

/* ================= RESET ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#0b1020;
    color:white;
    overflow-x:hidden;
}

/* ================= LAYOUT ================= */

.hidden{display:none;}

.app{
    display:flex;
}

/* ================= SIDEBAR ================= */

.sidebar{
    width:240px;
    height:100vh;
    background:#111a33;
    padding:20px;
}

.sidebar button{
    width:100%;
    margin:10px 0;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#1c2a55;
    color:white;
    cursor:pointer;
}

/* ================= MAIN ================= */

.main{
    flex:1;
    padding:20px;
}

/* ================= HOME ================= */

.hero{
    padding:20px;
    background:#16244a;
    border-radius:20px;
    margin-bottom:20px;
}

/* ================= BOARD ================= */

.board{
    width:480px;
    height:480px;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);
    border-radius:12px;
    overflow:hidden;
}

.square{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.light{background:#f0d9b5;}
.dark{background:#b58863;}

.piece{
    width:90%;
    height:90%;
}

/* FIX KHÔNG MÉO */
.board *{
    aspect-ratio:1/1;
}

/* ================= CHAT ================= */

.chat{
    margin-top:20px;
    background:#121a30;
    padding:10px;
    border-radius:10px;
}

.chat-box{
    height:200px;
    overflow:auto;
    margin-bottom:10px;
}

.msg{
    margin:5px 0;
    font-size:14px;
    opacity:0.9;
}

/* ================= MENU ================= */

.menu{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    background:#1a2550;
    padding:20px;
    border-radius:15px;
    cursor:pointer;
    text-align:center;
}

</style>
</head>

<body>

<!-- ================= MENU ================= -->

<div id="menu">

    <h1 style="padding:20px;">♟ NeonChess Menu</h1>

    <div class="menu">

        <div class="card" onclick="startGame(10)">⚡ 10s Bullet</div>
        <div class="card" onclick="startGame(30)">🔥 30s Blitz</div>
        <div class="card" onclick="startGame(0)">📅 Daily</div>
        <div class="card" onclick="showBoard()">▶ Play</div>

    </div>

</div>

<!-- ================= APP ================= -->

<div id="app" class="app hidden">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <button onclick="backMenu()">🏠 Menu</button>
        <button onclick="showBoard()">♟ Board</button>
        <button onclick="toggleChat()">💬 Chat</button>

    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- BOARD -->
        <div id="boardWrap" class="hidden">

            <h2>Chess Board</h2>

            <div id="board" class="board"></div>

        </div>

        <!-- CHAT -->
        <div id="chatWrap" class="chat hidden">

            <div id="chatBox" class="chat-box"></div>

            <input id="msg" placeholder="chat..." />
            <button onclick="sendMsg()">Send</button>

        </div>

    </div>

</div>

<script type="module">

/* ================= FIREBASE ================= */

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
getDatabase,
ref,
push,
onValue
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

const firebaseConfig = {
apiKey:"AIzaSy...",
authDomain:"neonchess-df7aa.firebaseapp.com",
databaseURL:"https://neonchess-df7aa-default-rtdb.firebaseio.com",
projectId:"neonchess-df7aa"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

/* ================= LOGIN ================= */

window.loginGoogle = async ()=>{
const provider = new GoogleAuthProvider();
await signInWithPopup(auth, provider);
};

/* ================= AUTH ================= */

onAuthStateChanged(auth,(user)=>{
if(user){
console.log("LOGGED:",user.email);
}
});

/* ================= NAV ================= */

window.showBoard = ()=>{
document.getElementById("menu").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");
document.getElementById("boardWrap").classList.remove("hidden");
};

window.backMenu = ()=>{
document.getElementById("menu").classList.remove("hidden");
document.getElementById("app").classList.add("hidden");
};

/* ================= GAME MODE ================= */

window.startGame = (time)=>{
alert("Game time: " + time + "s");
showBoard();
};

/* ================= CHAT ================= */

window.toggleChat = ()=>{
document.getElementById("chatWrap").classList.toggle("hidden");
};

window.sendMsg = ()=>{
const input = document.getElementById("msg");
push(ref(db,"chat"),{
text:input.value,
time:Date.now()
});
input.value="";
};

const chatBox = document.getElementById("chatBox");

onValue(ref(db,"chat"),(snap)=>{
chatBox.innerHTML="";
snap.forEach(m=>{
const v=m.val();
const d=new Date(v.time).toLocaleTimeString();
chatBox.innerHTML+=`
<div class="msg">[${d}] ${v.text}</div>
`;
});
});

</script>

</body>
</html>
