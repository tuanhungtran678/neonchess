<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NeonChess Ultimate</title>

<style>

/* ========================================================= */
/* RESET */
/* ========================================================= */

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

    font-family:
    "Segoe UI",
    sans-serif;
}

body{

    background:
    linear-gradient(
        135deg,
        #020617,
        #0f172a,
        #111827
    );

    color:white;

    min-height:100vh;

    overflow:hidden;
}

/* ========================================================= */
/* BACKGROUND */
/* ========================================================= */

.bg{

    position:fixed;

    inset:0;

    overflow:hidden;

    z-index:-1;
}

.glow{

    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    filter:blur(120px);

    opacity:.22;

    animation:
    moveGlow 12s infinite alternate;
}

.glow1{

    background:#00ffae;

    top:-120px;
    left:-120px;
}

.glow2{

    background:#00c3ff;

    right:-120px;
    bottom:-120px;
}

@keyframes moveGlow{

    from{

        transform:
        translate(0,0);
    }

    to{

        transform:
        translate(60px,40px);
    }

}

/* ========================================================= */
/* LAYOUT */
/* ========================================================= */

.container{

    display:grid;

    grid-template-columns:
    280px 1fr;

    height:100vh;
}

/* ========================================================= */
/* SIDEBAR */
/* ========================================================= */

.sidebar{

    background:
    rgba(255,255,255,.05);

    border-right:
    1px solid rgba(255,255,255,.08);

    backdrop-filter:
    blur(25px);

    padding:22px;
}

.logo{

    font-size:34px;

    font-weight:900;

    margin-bottom:30px;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.menu{

    display:flex;

    flex-direction:column;

    gap:12px;
}

.menu button{

    border:none;

    background:
    rgba(255,255,255,.06);

    color:white;

    padding:16px;

    border-radius:18px;

    text-align:left;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.menu button:hover{

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;

    transform:
    translateX(6px);
}

/* ========================================================= */
/* MAIN */
/* ========================================================= */

.main{

    padding:24px;

    overflow:auto;
}

/* ========================================================= */
/* TOPBAR */
/* ========================================================= */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:26px;
}

.top-title{

    font-size:42px;

    font-weight:900;
}

.login-btn{

    border:none;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;

    font-weight:900;

    padding:14px 20px;

    border-radius:18px;

    cursor:pointer;

    font-size:15px;
}

/* ========================================================= */
/* HERO */
/* ========================================================= */

.hero{

    background:
    linear-gradient(
        135deg,
        rgba(0,255,174,.15),
        rgba(0,195,255,.08)
    );

    border:
    1px solid rgba(255,255,255,.08);

    border-radius:32px;

    padding:36px;

    margin-bottom:24px;

    backdrop-filter:
    blur(24px);
}

.hero h1{

    font-size:62px;

    line-height:1.05;

    margin-bottom:18px;
}

.hero h1 span{

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.hero p{

    color:#cbd5e1;

    font-size:19px;

    line-height:1.7;

    max-width:700px;
}

/* ========================================================= */
/* CONTENT */
/* ========================================================= */

.content{

    display:grid;

    grid-template-columns:
    1fr 360px;

    gap:22px;
}

/* ========================================================= */
/* CARD */
/* ========================================================= */

.card{

    background:
    rgba(255,255,255,.05);

    border:
    1px solid rgba(255,255,255,.08);

    border-radius:28px;

    padding:24px;

    backdrop-filter:
    blur(24px);
}

/* ========================================================= */
/* BOARD */
/* ========================================================= */

.board{

    width:100%;

    max-width:760px;

    aspect-ratio:1/1;

    margin:auto;

    display:grid;

    grid-template-columns:
    repeat(8,1fr);

    border-radius:22px;

    overflow:hidden;

    box-shadow:
    0 0 40px rgba(0,255,174,.18);
}

.square{

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;
}

.light{

    background:#f0d9b5;
}

.dark{

    background:#b58863;
}

.square:hover{

    filter:brightness(1.08);
}

.selected{

    box-shadow:
    inset 0 0 0 5px #00ffae;
}

.move::after{

    content:"";

    width:18px;
    height:18px;

    border-radius:50%;

    background:
    rgba(0,255,174,.7);

    position:absolute;
}

.piece{

    width:82%;
    height:82%;

    object-fit:contain;

    cursor:pointer;

    transition:.15s;
}

.piece:hover{

    transform:
    scale(1.08);
}

/* ========================================================= */
/* PROFILE */
/* ========================================================= */

.profile{

    text-align:center;
}

.avatar{

    width:110px;
    height:110px;

    border-radius:50%;

    border:
    4px solid #00ffae;

    margin-bottom:16px;
}

.badge{

    display:inline-block;

    margin-top:10px;

    padding:8px 14px;

    border-radius:999px;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;

    font-weight:900;
}

.stats{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:12px;

    margin-top:20px;
}

.stat{

    background:
    rgba(255,255,255,.05);

    border-radius:18px;

    padding:14px;
}

.stat-value{

    font-size:28px;

    font-weight:900;

    margin-top:8px;
}

@media(max-width:1100px){

    .container{

        grid-template-columns:
        1fr;
    }

    .sidebar{

        display:none;
    }

    .content{

        grid-template-columns:
        1fr;
    }

    .hero h1{

        font-size:42px;
    }

}

</style>
</head>
<body>

<div class="bg">

    <div class="glow glow1"></div>

    <div class="glow glow2"></div>

</div>

<div class="container">

    <!-- ===================================================== -->
    <!-- SIDEBAR -->
    <!-- ===================================================== -->

    <div class="sidebar">

        <div class="logo">

            ♟ NeonChess

        </div>

        <div class="menu">

            <button>▶ Play</button>

            <button>🧩 Puzzle Rush</button>

            <button>🏆 Ranked</button>

            <button>📺 Neon TV</button>

            <button>👤 Profile</button>

            <button>⚙ Settings</button>

        </div>

    </div>

    <!-- ===================================================== -->
    <!-- MAIN -->
    <!-- ===================================================== -->

    <div class="main">

        <div class="topbar">

            <div class="top-title">

                NeonChess

            </div>

            <button
            class="login-btn"
            id="loginBtn">

                🔐 Login Google

            </button>

        </div>

        <!-- ================================================= -->
        <!-- HERO -->
        <!-- ================================================= -->

        <div class="hero">

            <h1>

                Play Chess
                <span>Like PS5</span>

            </h1>

            <p>

                NeonChess combines
                realtime multiplayer,
                puzzle rush,
                cloud profiles,
                global leaderboard
                and ultra neon gaming UI.

            </p>

        </div>

        <!-- ================================================= -->
        <!-- CONTENT -->
        <!-- ================================================= -->

        <div class="content">

            <!-- ============================================= -->
            <!-- BOARD -->
            <!-- ============================================= -->

            <div class="card">

                <div
                id="board"
                class="board"></div>

            </div>

            <!-- ============================================= -->
            <!-- PROFILE -->
            <!-- ============================================= -->

            <div class="card">

                <div class="profile">

                    <img
                    id="avatar"
                    class="avatar"
                    src="https://i.pravatar.cc/200">

                    <h2 id="username">

                        Guest

                    </h2>

                    <p id="email">

                        Not logged in

                    </p>

                    <div class="badge">

                        ADMIN SITE

                    </div>

                    <div class="stats">

                        <div class="stat">

                            🪙

                            <div
                            class="stat-value">

                                500

                            </div>

                        </div>

                        <div class="stat">

                            🏆

                            <div
                            class="stat-value">

                                1200

                            </div>

                        </div>

                        <div class="stat">

                            🔥

                            <div
                            class="stat-value">

                                0

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script type="module">

/* ========================================================= */
/* CHESS */
/* ========================================================= */

import { Chess }
from
"https://cdn.jsdelivr.net/npm/chess.js@1.0.0-beta.6/+esm";

/* ========================================================= */
/* FIREBASE */
/* ========================================================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {

getAuth,
GoogleAuthProvider,
signInWithPopup,
signOut,
onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

/* ========================================================= */
/* FIREBASE CONFIG */
/* ========================================================= */

const firebaseConfig = {

apiKey:
"AIzaSyByZbESWCAXypIJKBUNIm6KDmcXWX7SMgk",

authDomain:
"neonchess-df7aa.firebaseapp.com",

databaseURL:
"https://neonchess-df7aa-default-rtdb.firebaseio.com",

projectId:
"neonchess-df7aa",

storageBucket:
"neonchess-df7aa.firebasestorage.app",

messagingSenderId:
"784833820179",

appId:
"1:784833820179:web:3613d907d2a5b321bff1e6",

measurementId:
"G-LBDENJ65N7"

};

/* ========================================================= */
/* INIT */
/* ========================================================= */

const app =
initializeApp(
firebaseConfig
);

const auth =
getAuth(app);

const provider =
new GoogleAuthProvider();

/* ========================================================= */
/* LOGIN */
/* ========================================================= */

const loginBtn =
document.getElementById(
"loginBtn"
);

loginBtn.onclick =
()=>{

signInWithPopup(
auth,
provider
);

};

/* ========================================================= */
/* AUTH */
/* ========================================================= */

onAuthStateChanged(

auth,

(user)=>{

if(user){

document.getElementById(
"username"
).textContent =
user.displayName;

document.getElementById(
"email"
).textContent =
user.email;

document.getElementById(
"avatar"
).src =
user.photoURL;

loginBtn.innerHTML =
"🚪 Logout";

loginBtn.onclick =
()=>signOut(auth);

}

else{

loginBtn.innerHTML =
"🔐 Login Google";

loginBtn.onclick =
()=>{

signInWithPopup(
auth,
provider
);

};

}

}

);

/* ========================================================= */
/* GAME */
/* ========================================================= */

const game =
new Chess();

let selected =
null;

/* ========================================================= */
/* PIECES */
/* ========================================================= */

const pieces = {

r:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/br.png",
n:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bn.png",
b:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bb.png",
q:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bq.png",
k:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bk.png",
p:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bp.png",

R:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wr.png",
N:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wn.png",
B:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wb.png",
Q:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wq.png",
K:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wk.png",
P:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wp.png"

};

/* ========================================================= */
/* DRAW */
/* ========================================================= */

function drawBoard(){

const board =
document.getElementById(
"board"
);

board.innerHTML =
"";

const current =
game.board();

for(let y=0;y<8;y++){

for(let x=0;x<8;x++){

const sq =
document.createElement(
"div"
);

sq.className =
"square " +
(
(x+y)%2===0
? "light"
: "dark"
);

const file =
"abcdefgh"[x];

const rank =
8-y;

const name =
file + rank;

sq.dataset.square =
name;

const piece =
current[y][x];

if(piece){

const code =
piece.color==="w"
? piece.type.toUpperCase()
: piece.type;

const img =
document.createElement(
"img"
);

img.src =
pieces[code];

img.className =
"piece";

sq.appendChild(
img
);

}

/* ===================================================== */
/* CLICK */
/* ===================================================== */

sq.onclick =
()=>{

if(selected){

const move =
game.move({

from:selected,
to:name,
promotion:"q"

});

selected =
null;

drawBoard();

return;

}

const p =
game.get(name);

if(p){

selected =
name;

drawBoard();

highlight(
name
);

showMoves(
name
);

}

};

board.appendChild(
sq
);

}

}

}

/* ========================================================= */
/* HIGHLIGHT */
/* ========================================================= */

function highlight(name){

const sq =
document.querySelector(
`[data-square="${name}"]`
);

if(sq){

sq.classList.add(
"selected"
);

}

}

/* ========================================================= */
/* MOVES */
/* ========================================================= */

function showMoves(square){

const moves =
game.moves({

square:square,
verbose:true

});

moves.forEach(move=>{

const sq =
document.querySelector(
`[data-square="${move.to}"]`
);

if(sq){

sq.classList.add(
"move"
);

}

});

}

/* ========================================================= */
/* START */
/* ========================================================= */

drawBoard();

</script>

</body>
</html>
