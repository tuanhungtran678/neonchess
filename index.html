<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeonChess Firebase</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#0f172a;
    color:white;
    min-height:100vh;
    padding:20px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

button{
    border:none;
    padding:12px 18px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
}

.login-btn{
    background:#00ffae;
}

.logout-btn{
    background:#ff4d4d;
    color:white;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.card{
    background:rgba(255,255,255,.05);
    border-radius:20px;
    padding:20px;
}

.profile{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:20px;
}

.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    border:4px solid #00ffae;
}

.stats{
    display:flex;
    gap:12px;
    margin-top:20px;
}

.stat{
    flex:1;
    background:rgba(255,255,255,.05);
    padding:14px;
    border-radius:16px;
    text-align:center;
}

.stat-value{
    font-size:28px;
    font-weight:bold;
    margin-top:6px;
}

#leaderboard .leader-item{
    display:flex;
    justify-content:space-between;
    padding:12px;
    background:rgba(255,255,255,.04);
    border-radius:12px;
    margin-top:10px;
}

#chatBox{
    max-height:300px;
    overflow:auto;
}

.chat-message{
    display:flex;
    gap:12px;
    align-items:center;
    background:rgba(255,255,255,.05);
    padding:10px;
    border-radius:12px;
    margin-top:10px;
}

.chat-message img{
    width:50px;
    height:50px;
    border-radius:50%;
}

.chat-controls{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.chat-controls input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:12px;
}

.store-btn{
    width:100%;
    margin-top:15px;
    background:#00c3ff;
}

.room-btn{
    width:100%;
    margin-top:15px;
    background:#8b5cf6;
    color:white;
}

</style>
</head>
<body>

<div class="topbar">

    <h1>♟ NeonChess Firebase</h1>

    <div>

        <button
        id="loginBtn"
        class="login-btn"
        onclick="loginGoogle()">
            Login Google
        </button>

        <button
        id="logoutBtn"
        class="logout-btn"
        onclick="logoutGoogle()"
        style="display:none;">
            Logout
        </button>

    </div>

</div>

<div class="grid">

    <div class="card">

        <h2>👤 Profile</h2>

        <div class="profile">

            <img
            id="avatar"
            class="avatar">

            <div>

                <h2 id="name">
                    Guest
                </h2>

                <p id="email">
                    Chưa đăng nhập
                </p>

                <p>
                    ADMIN SITE
                </p>

            </div>

        </div>

        <div class="stats">

            <div class="stat">
                Coin
                <div
                id="coin"
                class="stat-value">
                    0
                </div>
            </div>

            <div class="stat">
                ELO
                <div
                id="elo"
                class="stat-value">
                    1200
                </div>
            </div>

            <div class="stat">
                Streak
                <div
                id="streak"
                class="stat-value">
                    0
                </div>
            </div>

        </div>

        <button
        class="store-btn"
        onclick="buyFreeze()">
            Buy Streak Freeze (100 Coin)
        </button>

        <button
        class="room-btn"
        onclick="createRoom()">
            Create Multiplayer Room
        </button>

    </div>

    <div class="card">

        <h2>🏆 Leaderboard</h2>

        <div id="leaderboard"></div>

    </div>

    <div class="card">

        <h2>💬 Realtime Chat</h2>

        <div id="chatBox"></div>

        <div class="chat-controls">

            <input
            id="chatInput"
            placeholder="Nhắn gì đó...">

            <button onclick="sendChat()">
                Send
            </button>

        </div>

    </div>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {

    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut

} from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {

    getDatabase,
    ref,
    set,
    get,
    push,
    onValue,
    update

} from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {

  apiKey: "AIzaSyByZbESWCAXypIJKBUNIm6KDmcXWX7SMgk",

  authDomain: "neonchess-df7aa.firebaseapp.com",

  databaseURL:
  "https://neonchess-df7aa-default-rtdb.firebaseio.com",

  projectId: "neonchess-df7aa",

  storageBucket:
  "neonchess-df7aa.firebasestorage.app",

  messagingSenderId: "784833820179",

  appId:
  "1:784833820179:web:3613d907d2a5b321bff1e6",

  measurementId:
  "G-LBDENJ65N7"

};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();

window.currentUser = null;

window.loginGoogle = async function(){

    await signInWithPopup(
        auth,
        provider
    );

}

window.logoutGoogle = async function(){

    await signOut(auth);

}

onAuthStateChanged(auth, async(user)=>{

    if(!user){

        document.getElementById(
            "loginBtn"
        ).style.display = "inline-block";

        document.getElementById(
            "logoutBtn"
        ).style.display = "none";

        return;

    }

    currentUser = user;

    document.getElementById(
        "loginBtn"
    ).style.display = "none";

    document.getElementById(
        "logoutBtn"
    ).style.display = "inline-block";

    await createUserData();

    loadProfile();

    loadLeaderboard();

    loadChat();

});

async function createUserData(){

    const userRef =
    ref(db,"users/" + currentUser.uid);

    const snap =
    await get(userRef);

    if(!snap.exists()){

        await set(userRef,{

            name:
            currentUser.displayName,

            email:
            currentUser.email,

            avatar:
            currentUser.photoURL,

            coin:500,

            elo:1200,

            streak:0,

            admin:true

        });

    }

}

function loadProfile(){

    const userRef =
    ref(db,"users/" + currentUser.uid);

    onValue(userRef,(snap)=>{

        const data = snap.val();

        if(!data) return;

        document.getElementById(
            "avatar"
        ).src = data.avatar;

        document.getElementById(
            "name"
        ).textContent = data.name;

        document.getElementById(
            "email"
        ).textContent = data.email;

        document.getElementById(
            "coin"
        ).textContent = data.coin;

        document.getElementById(
            "elo"
        ).textContent = data.elo;

        document.getElementById(
            "streak"
        ).textContent = data.streak;

    });

}

window.buyFreeze = async function(){

    const userRef =
    ref(db,"users/" + currentUser.uid);

    const snap =
    await get(userRef);

    const data = snap.val();

    if(data.coin < 100){

        alert("Không đủ Coin");

        return;

    }

    await update(userRef,{

        coin:data.coin - 100,

        streakFreeze:true

    });

    alert("Đã mua Streak Freeze");

}

function loadLeaderboard(){

    onValue(ref(db,"users"),(snap)=>{

        const data = snap.val();

        if(!data) return;

        const players =
        Object.values(data);

        players.sort((a,b)=>
            b.elo - a.elo
        );

        const board =
        document.getElementById(
            "leaderboard"
        );

        board.innerHTML = "";

        players.slice(0,10).forEach((p,i)=>{

            board.innerHTML += `

            <div class="leader-item">

                <div>
                    #${i+1} ${p.name}
                </div>

                <div>
                    ${p.elo} ELO
                </div>

            </div>

            `;

        });

    });

}

window.sendChat = async function(){

    if(!currentUser) return;

    const input =
    document.getElementById(
        "chatInput"
    );

    if(!input.value) return;

    await push(
        ref(db,"chat"),
        {
            name:currentUser.displayName,
            avatar:currentUser.photoURL,
            message:input.value,
            time:Date.now()
        }
    );

    input.value = "";

}

function loadChat(){

    onValue(ref(db,"chat"),(snap)=>{

        const data = snap.val();

        if(!data) return;

        const messages =
        Object.values(data);

        const box =
        document.getElementById(
            "chatBox"
        );

        box.innerHTML = "";

        messages.forEach(msg=>{

            box.innerHTML += `

            <div class="chat-message">

                <img src="${msg.avatar}">

                <div>
                    <b>${msg.name}</b>
                    <br>
                    ${msg.message}
                </div>

            </div>

            `;

        });

    });

}

window.createRoom = async function(){

    if(!currentUser) return;

    const roomRef =
    push(ref(db,"rooms"));

    await set(roomRef,{

        host:
        currentUser.uid,

        hostName:
        currentUser.displayName,

        createdAt:
        Date.now()

    });

    alert(
        "Room ID: " + roomRef.key
    );

}

console.log(
    "NeonChess Firebase Ready"
);

</script>

</body>
</html>
