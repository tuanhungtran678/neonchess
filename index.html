<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeonChess TBM</title>

<style>

/* ========================= */
/* RESET */
/* ========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#0b1020;
    color:white;
    overflow:hidden;
}

/* ========================= */
/* LAYOUT */
/* ========================= */

.app{
    display:flex;
    height:100vh;
}

/* ========================= */
/* SIDEBAR */
/* ========================= */

.sidebar{
    width:220px;
    background:#0f172a;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.btn{
    padding:12px;
    background:#1e293b;
    border:none;
    color:white;
    border-radius:10px;
    cursor:pointer;
}

.btn:hover{
    background:#00ffae;
    color:black;
}

/* ========================= */
/* MAIN */
/* ========================= */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

/* ========================= */
/* TOPBAR */
/* ========================= */

.topbar{
    height:60px;
    background:#0f172a;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 15px;
}

.logo{
    font-weight:900;
    color:#00ffae;
}

.login{
    background:linear-gradient(90deg,#00ffae,#00c3ff);
    border:none;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
}

/* ========================= */
/* CONTENT */
/* ========================= */

.content{
    display:flex;
    flex:1;
}

/* ========================= */
/* BOARD */
/* ========================= */

.board{
    width:520px;
    height:520px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);
    border:4px solid #00ffae;
}

.square{
    width:100%;
    height:100%;
}

.light{background:#f0d9b5;}
.dark{background:#b58863;}

.piece{
    width:100%;
    height:100%;
}

/* ========================= */
/* RIGHT PANEL */
/* ========================= */

.panel{
    width:320px;
    background:#0f172a;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* ========================= */
/* CHAT */
/* ========================= */

.chat{
    flex:1;
    overflow:auto;
    background:#111827;
    padding:10px;
    border-radius:10px;
}

.msg{
    margin-bottom:8px;
    font-size:13px;
    color:#cbd5e1;
}

.time{
    color:#00ffae;
    font-size:11px;
}

/* ========================= */
/* TIMER MODES */
/* ========================= */

.modes button{
    width:100%;
    margin-bottom:5px;
}

/* ========================= */
/* INPUT */
/* ========================= */

input{
    padding:10px;
    border:none;
    border-radius:10px;
}

.send{
    background:#00ffae;
    border:none;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="app">

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">

    <button class="btn">Home</button>
    <button class="btn">Play</button>
    <button class="btn">Puzzle</button>
    <button class="btn">Profile</button>

</div>

<!-- ================= MAIN ================= -->
<div class="main">

    <!-- TOP -->
    <div class="topbar">

        <div class="logo">NEONCHESS</div>

        <button class="login" onclick="login()">
            Login Google
        </button>

    </div>

    <!-- CONTENT -->
    <div class="content">

        <!-- BOARD -->
        <div id="board" class="board"></div>

        <!-- RIGHT -->
        <div class="panel">

            <!-- MODES -->
            <div class="modes">

                <button class="btn" onclick="setTime(10)">⚡ 10s Bullet</button>
                <button class="btn" onclick="setTime(30)">⚡ 30s Blitz</button>
                <button class="btn" onclick="setTime(86400)">📅 Daily</button>

            </div>

            <!-- CHAT -->
            <div id="chat" class="chat"></div>

            <input id="msg" placeholder="Chat...">
            <button class="send" onclick="sendMsg()">Send</button>

        </div>

    </div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import {
getAuth, GoogleAuthProvider, signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
getDatabase, ref, push, onChildAdded
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

/* ================= FIREBASE ================= */

const firebaseConfig = {
apiKey:"AIzaSy...",
authDomain:"neonchess-df7aa.firebaseapp.com",
databaseURL:"https://neonchess-df7aa-default-rtdb.firebaseio.com",
projectId:"neonchess-df7aa"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

/* ================= LOGIN ================= */

window.login = async ()=>{
    const provider = new GoogleAuthProvider();
    await signInWithPopup(auth, provider);
};

/* ================= CHAT ================= */

window.sendMsg = ()=>{
    const text = document.getElementById("msg").value;

    push(ref(db,"chat"),{
        text,
        time:new Date().toLocaleTimeString()
    });

    document.getElementById("msg").value="";
};

onChildAdded(ref(db,"chat"), snap=>{
    const data = snap.val();

    const div = document.createElement("div");
    div.className="msg";
    div.innerHTML = `
        <span class="time">[${data.time}]</span> ${data.text}
    `;

    document.getElementById("chat").appendChild(div);
});

/* ================= TIMER MODE ================= */

window.setTime = (t)=>{
    alert("Mode set: " + t + " seconds");
};

/* ================= CHESS (FIX BOARD) ================= */

const pieces = {
r:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/br.png",
n:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/bn.png",
b:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/bb.png",
q:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/bq.png",
k:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/bk.png",
p:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/bp.png",

R:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wr.png",
N:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wn.png",
B:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wb.png",
Q:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wq.png",
K:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wk.png",
P:"https://images.chesscomfiles.com/chess-themes/pieces/classic/150/wp.png
"
};

const start=[
"rnbqkbnr",
"pppppppp",
"........",
"........",
"........",
"........",
"PPPPPPPP",
"RNBQKBNR"
];

const board = document.getElementById("board");

start.forEach((row,y)=>{
for(let x=0;x<8;x++){

const sq=document.createElement("div");
sq.className="square "+((x+y)%2?"dark":"light");

const c=row[x];

if(c!=="." ){
const img=document.createElement("img");
img.src=pieces[c];
img.className="piece";
sq.appendChild(img);
}

board.appendChild(sq);

}
});

</script>

</body>
</html>
