<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NeonChess</title>

<link
rel="icon"
href="https://www.chess.com/bundles/web/images/icons/favicon.ico">

<style>

/* ========================================================= */
/* RESET */
/* ========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
    "Segoe UI",
    sans-serif;
}

body{

    background:
    linear-gradient(
        135deg,
        #030712,
        #0b1120,
        #111827
    );

    color:white;

    overflow-x:hidden;
}

/* ========================================================= */
/* BG */
/* ========================================================= */

.bg{

    position:fixed;

    inset:0;

    z-index:-1;

    overflow:hidden;
}

.glow{

    position:absolute;

    border-radius:50%;

    filter:blur(120px);

    opacity:.22;
}

.glow1{

    width:520px;
    height:520px;

    background:#00ffae;

    top:-150px;
    left:-150px;
}

.glow2{

    width:520px;
    height:520px;

    background:#00c3ff;

    right:-150px;
    bottom:-150px;
}

/* ========================================================= */
/* LAYOUT */
/* ========================================================= */

.container{

    display:grid;

    grid-template-columns:
    290px 1fr;

    min-height:100vh;
}

/* ========================================================= */
/* SIDEBAR */
/* ========================================================= */

.sidebar{

    background:
    rgba(255,255,255,.03);

    border-right:
    1px solid rgba(255,255,255,.06);

    backdrop-filter:
    blur(24px);

    padding:24px;

    display:flex;

    flex-direction:column;
}

.logo{

    font-size:42px;

    font-weight:900;

    margin-bottom:36px;
}

.menu{

    display:flex;

    flex-direction:column;

    gap:14px;
}

.menu button{

    border:none;

    padding:18px;

    border-radius:22px;

    background:
    rgba(255,255,255,.04);

    color:white;

    font-size:17px;

    font-weight:800;

    text-align:left;

    cursor:pointer;

    transition:.2s;
}

.menu button:hover{

    transform:
    translateX(8px);

    background:
    linear-gradient(
        90deg,
        rgba(0,255,174,.18),
        rgba(0,195,255,.18)
    );
}

/* ========================================================= */
/* MAIN */
/* ========================================================= */

.main{

    padding:24px;
}

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:24px;
}

.title{

    font-size:58px;

    font-weight:900;
}

.subtitle{

    color:#9ca3af;
}

.login-btn{

    border:none;

    padding:16px 24px;

    border-radius:18px;

    font-weight:900;

    cursor:pointer;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;
}

/* ========================================================= */
/* HERO */
/* ========================================================= */

.hero{

    position:relative;

    overflow:hidden;

    padding:44px;

    border-radius:34px;

    margin-bottom:24px;

    background:
    linear-gradient(
        135deg,
        rgba(255,255,255,.05),
        rgba(255,255,255,.02)
    );

    border:
    1px solid rgba(255,255,255,.08);
}

.hero::before{

    content:"";

    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    background:
    radial-gradient(
        rgba(0,255,174,.2),
        transparent 70%
    );

    top:-180px;
    right:-180px;
}

.hero h1{

    font-size:74px;

    line-height:1.05;

    margin-bottom:18px;
}

.hero span{

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

/* ========================================================= */
/* CONTENT */
/* ========================================================= */

.content{

    display:grid;

    grid-template-columns:
    1fr 340px;

    gap:24px;
}

.card{

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,.05),
        rgba(255,255,255,.03)
    );

    border:
    1px solid rgba(255,255,255,.08);

    border-radius:34px;

    padding:24px;

    backdrop-filter:
    blur(24px);
}

/* ========================================================= */
/* BOARD */
/* ========================================================= */

.board-wrapper{

    position:relative;

    width:min(82vw,720px);

    margin:auto;
}

#arrowLayer{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

    z-index:5;
}

.board{

    width:100%;

    aspect-ratio:1/1;

    display:grid;

    grid-template-columns:
    repeat(8,1fr);

    overflow:hidden;

    border-radius:22px;

    box-shadow:
    0 0 40px rgba(0,255,174,.18);
}

.square{

    aspect-ratio:1/1;

    display:flex;

    justify-content:center;

    align-items:center;

    position:relative;
}

.light{
    background:#f0d9b5;
}

.dark{
    background:#b58863;
}

.selected{

    box-shadow:
    inset 0 0 0 5px #00ffae;
}

.move::after{

    content:"";

    width:18px;
    height:18px;

    border-radius:50%;

    background:
    rgba(0,255,174,.75);

    position:absolute;
}

.piece{

    width:78%;
    height:78%;

    object-fit:contain;

    cursor:grab;

    transition:.12s;

    user-select:none;

    -webkit-user-drag:none;

    z-index:2;
}

.piece:hover{

    transform:scale(1.08);
}

/* ========================================================= */
/* ACTIONS */
/* ========================================================= */

.actions{

    display:flex;

    gap:12px;

    flex-wrap:wrap;

    margin-top:22px;
}

.actions button{

    border:none;

    padding:14px 18px;

    border-radius:16px;

    font-weight:900;

    cursor:pointer;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;
}

/* ========================================================= */
/* PROFILE */
/* ========================================================= */

.profile{

    text-align:center;
}

.avatar{

    width:120px;
    height:120px;

    border-radius:50%;

    border:
    4px solid #00ffae;

    margin-bottom:18px;
}

.badge{

    display:inline-block;

    margin-top:14px;

    padding:8px 14px;

    border-radius:999px;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;

    font-weight:900;
}

.stats{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:12px;

    margin-top:24px;
}

.stat{

    padding:14px;

    border-radius:18px;

    background:
    rgba(255,255,255,.05);
}

.stat-value{

    font-size:28px;

    font-weight:900;
}

.history{

    margin-top:24px;

    padding:16px;

    border-radius:18px;

    background:
    rgba(255,255,255,.05);

    max-height:220px;

    overflow:auto;
}

/* ========================================================= */
/* MOBILE */
/* ========================================================= */

@media(max-width:1100px){

    .container{

        grid-template-columns:
        1fr;
    }

    .sidebar{

        display:none;
    }

    .content{

        grid-template-columns:
        1fr;
    }

}

</style>
</head>
<body>

<div class="bg">

    <div class="glow glow1"></div>

    <div class="glow glow2"></div>

</div>

<div class="container">

    <!-- ================================================= -->
    <!-- SIDEBAR -->
    <!-- ================================================= -->

    <div class="sidebar">

        <div class="logo">
            ♟ NeonChess
        </div>

        <div class="menu">

            <button onclick="startBullet()">
                ⚡ Bullet
            </button>

            <button onclick="startBlitz()">
                🔥 Blitz
            </button>

            <button onclick="startRapid()">
                🧠 Rapid
            </button>

            <button onclick="startMultiplayer()">
                🌍 Multiplayer
            </button>

            <button onclick="startPuzzle()">
                🧩 Puzzle
            </button>

            <button onclick="playVsAI()">
                🤖 Play vs AI
            </button>

            <button onclick="openTrainer()">
                🎯 Trainer
            </button>

            <button onclick="openEditor()">
                🎬 Edit Video
            </button>

        </div>

    </div>

    <!-- ================================================= -->
    <!-- MAIN -->
    <!-- ================================================= -->

    <div class="main">

        <div class="topbar">

            <div>

                <div class="title">
                    NeonChess
                </div>

                <div class="subtitle">
                    PS5 Style Chess Experience
                </div>

            </div>

            <button
            class="login-btn"
            id="loginBtn">

                🔐 Login Google

            </button>

        </div>

        <div class="hero">

            <h1>

                Play Chess
                Like a
                <span>PS5 Game</span>

            </h1>

        </div>

        <div class="content">

            <!-- ========================================= -->
            <!-- BOARD -->
            <!-- ========================================= -->

            <div class="card">

                <div class="board-wrapper">

                    <svg
                    id="arrowLayer"></svg>

                    <div
                    id="board"
                    class="board"></div>

                </div>

                <div class="actions">

                    <button onclick="newGame()">
                        ♻ New Game
                    </button>

                    <button onclick="showBestMove()">
                        🤖 Best Move
                    </button>

                </div>

                <div class="history">

                    <b>📜 Match History</b>

                    <div id="moves"></div>

                </div>

            </div>

            <!-- PROFILE CARD -->
            <div class="card">

                <div class="profile">

                    <img
                    id="avatar"
                    class="avatar"
                    src="https://i.pravatar.cc/200">

                    <h2 id="username">
                        Guest 🇻🇳
                    </h2>

                    <p id="email">
                        Not logged in
                    </p>

                    <div class="badge">
                        ADMIN SITE
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script type="module">

import { Chess }
from
"https://cdn.jsdelivr.net/npm/chess.js@1.0.0-beta.6/+esm";

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {

getAuth,
GoogleAuthProvider,
signInWithPopup,
signOut,
onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

/* ========================================================= */
/* FIREBASE */
/* ========================================================= */

const firebaseConfig = {

apiKey:
"YOUR_API_KEY",

authDomain:
"YOUR_AUTH_DOMAIN",

databaseURL:
"YOUR_DATABASE_URL",

projectId:
"YOUR_PROJECT_ID",

storageBucket:
"YOUR_STORAGE_BUCKET",

messagingSenderId:
"YOUR_MESSAGING_SENDER_ID",

appId:
"YOUR_APP_ID",

measurementId:
"YOUR_MEASUREMENT_ID"

};

const app =
initializeApp(
firebaseConfig
);

const auth =
getAuth(app);

const provider =
new GoogleAuthProvider();

/* ========================================================= */
/* LOGIN */
/* ========================================================= */

const loginBtn =
document.getElementById(
"loginBtn"
);

loginBtn.onclick =
()=>{

signInWithPopup(
auth,
provider
);

};

onAuthStateChanged(

auth,

(user)=>{

if(user){

document.getElementById(
"username"
).textContent =
user.displayName + " 🇻🇳";

document.getElementById(
"email"
).textContent =
user.email;

document.getElementById(
"avatar"
).src =
user.photoURL;

loginBtn.innerHTML =
"🚪 Logout";

loginBtn.onclick =
()=>{

signOut(auth);

};

}

}

);

/* ========================================================= */
/* CHESS */
/* ========================================================= */

const game =
new Chess();

const board =
document.getElementById(
"board"
);

let selected =
null;

let dragFrom =
null;

/* ========================================================= */
/* STOCKFISH */
/* ========================================================= */

const stockfish =
new Worker(
"./stockfish-18-lite-single.js"
);

stockfish.postMessage(
"uci"
);

stockfish.postMessage(
"isready"
);

stockfish.postMessage(
"ucinewgame"
);

/* ========================================================= */
/* PIECES */
/* ========================================================= */

const pieces = {

r:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/br.png",
n:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bn.png",
b:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bb.png",
q:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bq.png",
k:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bk.png",
p:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bp.png",

R:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wr.png",
N:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wn.png",
B:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wb.png",
Q:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wq.png",
K:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wk.png",
P:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wp.png"

};

/* ========================================================= */
/* DRAW BOARD */
/* ========================================================= */

function drawBoard(){

board.innerHTML =
"";

const current =
game.board();

for(let y=0;y<8;y++){

for(let x=0;x<8;x++){

const square =
document.createElement(
"div"
);

square.className =
"square " +
(
(x+y)%2===0
? "light"
: "dark"
);

const file =
"abcdefgh"[x];

const rank =
8-y;

const name =
file + rank;

square.dataset.square =
name;

const piece =
current[y][x];

if(piece){

const code =
piece.color==="w"
? piece.type.toUpperCase()
: piece.type;

const img =
document.createElement(
"img"
);

img.src =
pieces[code];

img.className =
"piece";

img.draggable =
true;

img.addEventListener(

"dragstart",

()=>{

dragFrom =
name;

selected =
name;

}

);

square.appendChild(
img
);

}

square.onclick =
()=>{

if(selected===name){

selected =
null;

drawBoard();

return;

}

if(selected){

const move =
game.move({

from:selected,
to:name,
promotion:"q"

});

if(move){

selected =
null;

drawBoard();

updateHistory();

return;

}

}

const p =
game.get(name);

if(p){

selected =
name;

drawBoard();

highlight(name);

showMoves(name);

}

};

square.addEventListener(

"dragover",

(e)=>{

e.preventDefault();

}

);

square.addEventListener(

"drop",

()=>{

if(!dragFrom)return;

const move =
game.move({

from:dragFrom,
to:name,
promotion:"q"

});

if(move){

drawBoard();

updateHistory();

}

selected =
null;

dragFrom =
null;

}

);

board.appendChild(
square
);

}

}

}

/* ========================================================= */
/* HELPERS */
/* ========================================================= */

function highlight(name){

const sq =
document.querySelector(
`[data-square="${name}"]`
);

if(sq){

sq.classList.add(
"selected"
);

}

}

function showMoves(square){

const moves =
game.moves({

square:square,
verbose:true

});

moves.forEach(move=>{

const sq =
document.querySelector(
`[data-square="${move.to}"]`
);

if(sq){

sq.classList.add(
"move"
);

}

});

}

function updateHistory(){

document.getElementById(
"moves"
).innerHTML =
game.history().join(" ");

}

/* ========================================================= */
/* DRAW ARROW */
/* ========================================================= */

function drawArrow(
from,
to
){

const svg =
document.getElementById(
"arrowLayer"
);

svg.innerHTML =
"";

const fromEl =
document.querySelector(
`[data-square="${from}"]`
);

const toEl =
document.querySelector(
`[data-square="${to}"]`
);

if(
!fromEl ||
!toEl
)return;

const boardRect =
board.getBoundingClientRect();

const fromRect =
fromEl.getBoundingClientRect();

const toRect =
toEl.getBoundingClientRect();

let x1 =
fromRect.left -
boardRect.left +
fromRect.width/2;

let y1 =
fromRect.top -
boardRect.top +
fromRect.height/2;

let x2 =
toRect.left -
boardRect.left +
toRect.width/2;

let y2 =
toRect.top -
boardRect.top +
toRect.height/2;

const dx =
x2 - x1;

const dy =
y2 - y1;

const len =
Math.sqrt(
dx*dx + dy*dy
);

const offset =
34;

x1 +=
(dx/len) * offset;

y1 +=
(dy/len) * offset;

x2 -=
(dx/len) * offset;

y2 -=
(dy/len) * offset;

svg.innerHTML =

`
<defs>

<filter id="glow">

<feGaussianBlur
stdDeviation="4"
result="blur"/>

<feMerge>

<feMergeNode in="blur"/>

<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

<marker
id="arrowhead"

markerWidth="18"
markerHeight="18"

refX="9"
refY="9"

orient="auto">

<polygon
points="0 0, 18 9, 0 18"
fill="#00ffae"/>

</marker>

</defs>

<line

x1="${x1}"
y1="${y1}"

x2="${x2}"
y2="${y2}"

stroke="#00ffae"

stroke-width="14"

stroke-linecap="round"

marker-end="url(#arrowhead)"

filter="url(#glow)"

opacity="0.82"

/>

`;

}

/* ========================================================= */
/* BEST MOVE */
/* ========================================================= */

window.showBestMove =
()=>{

stockfish.postMessage(
"position fen " + game.fen()
);

stockfish.postMessage(
"go depth 15"
);

};

stockfish.onmessage =
(event)=>{

const text =
event.data;

console.log(
"SF:",
text
);

if(
text.startsWith(
"bestmove"
)
){

const move =
text.split(" ")[1];

if(
move &&
move !== "(none)"
){

drawArrow(

move.substring(0,2),

move.substring(2,4)

);

}

}

};

/* ========================================================= */
/* BUTTONS */
/* ========================================================= */

window.newGame =
()=>{

game.reset();

drawBoard();

updateHistory();

document.getElementById(
"arrowLayer"
).innerHTML =
"";

};

window.playVsAI =
()=>{

alert(
"🎮 AI Mode"
);

};

window.startPuzzle =
()=>{

alert(
"🧩 Puzzle Rush"
);

};

window.startBullet =
()=>{

alert(
"⚡ Bullet"
);

};

window.startBlitz =
()=>{

alert(
"🔥 Blitz"
);

};

window.startRapid =
()=>{

alert(
"🧠 Rapid"
);

};

window.startMultiplayer =
()=>{

alert(
"🌍 Multiplayer"
);

};

window.openTrainer =
()=>{

alert(
"🎯 Trainer"
);

};

window.openEditor =
()=>{

alert(
"🎬 Video Editor"
);

};

/* ========================================================= */
/* START */
/* ========================================================= */

drawBoard();

</script>

</body>
</html>
