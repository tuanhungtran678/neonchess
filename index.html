<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NeonChess Ultimate</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #020617
    );

    color:white;

    min-height:100vh;

    overflow-x:hidden;
}

/* ========================================================= */
/* SIDEBAR */
/* ========================================================= */

.sidebar{

    position:fixed;

    left:0;
    top:0;

    width:260px;

    height:100vh;

    background:
    rgba(15,23,42,.96);

    backdrop-filter:
    blur(18px);

    border-right:
    1px solid rgba(255,255,255,.08);

    padding:20px;

    display:flex;

    flex-direction:column;

    justify-content:space-between;

    z-index:999;
}

.sidebar-logo{

    font-size:34px;

    font-weight:900;

    margin-bottom:30px;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.sidebar-menu{

    display:flex;

    flex-direction:column;

    gap:12px;
}

.side-btn{

    width:100%;

    background:
    rgba(255,255,255,.05);

    color:white;

    border:none;

    padding:16px;

    border-radius:16px;

    text-align:left;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.side-btn:hover{

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;

    transform:
    translateX(6px);
}

.collapse-btn{

    width:100%;

    background:
    rgba(255,255,255,.06);

    color:white;

    border:none;

    padding:16px;

    border-radius:16px;

    font-size:22px;

    cursor:pointer;
}

/* ========================================================= */
/* COLLAPSE */
/* ========================================================= */

.sidebar.collapsed{

    width:90px;
}

.sidebar.collapsed .sidebar-logo{

    font-size:22px;
}

.sidebar.collapsed .side-btn{

    text-align:center;

    font-size:0;
}

.sidebar.collapsed .side-btn::first-letter{

    font-size:22px;
}

/* ========================================================= */
/* MAIN */
/* ========================================================= */

.main{

    margin-left:280px;

    padding:20px;

    transition:.2s;
}

.sidebar.collapsed ~ .main{

    margin-left:110px;
}

/* ========================================================= */
/* TOPBAR */
/* ========================================================= */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:30px;
}

.logo{

    font-size:42px;

    font-weight:900;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.top-buttons{

    display:flex;

    gap:12px;
}

button{

    border:none;

    padding:12px 18px;

    border-radius:14px;

    cursor:pointer;

    font-weight:700;

    transition:.2s;
}

button:hover{

    transform:
    scale(1.05);
}

.login-btn{

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;
}

.logout-btn{

    background:#ff4d4d;

    color:white;
}

/* ========================================================= */
/* GRID */
/* ========================================================= */

.grid{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:20px;
}

/* ========================================================= */
/* CARD */
/* ========================================================= */

.card{

    background:
    rgba(255,255,255,.06);

    backdrop-filter:
    blur(18px);

    border:
    1px solid rgba(255,255,255,.08);

    border-radius:24px;

    padding:24px;

    box-shadow:
    0 0 40px rgba(0,255,180,.12);
}

.card h2{

    margin-bottom:18px;

    font-size:28px;
}

/* ========================================================= */
/* PROFILE */
/* ========================================================= */

.profile{

    display:flex;

    align-items:center;

    gap:18px;

    margin-bottom:20px;
}

.avatar{

    width:90px;
    height:90px;

    border-radius:50%;

    border:
    4px solid #00ffae;

    box-shadow:
    0 0 25px rgba(0,255,174,.4);
}

.badge{

    display:inline-block;

    margin-top:8px;

    padding:8px 14px;

    border-radius:999px;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;

    font-weight:900;
}

/* ========================================================= */
/* STATS */
/* ========================================================= */

.stats{

    display:flex;

    gap:12px;

    margin-top:20px;
}

.stat{

    flex:1;

    background:
    rgba(255,255,255,.05);

    border-radius:18px;

    padding:16px;

    text-align:center;
}

.stat-value{

    font-size:30px;

    font-weight:900;

    margin-top:8px;
}

/* ========================================================= */
/* BUTTONS */
/* ========================================================= */

.store-btn{

    width:100%;

    margin-top:18px;

    background:
    linear-gradient(
        90deg,
        #00c3ff,
        #0099ff
    );

    color:white;
}

.room-btn{

    width:100%;

    margin-top:14px;

    background:
    linear-gradient(
        90deg,
        #8b5cf6,
        #6366f1
    );

    color:white;
}

/* ========================================================= */
/* LEADERBOARD */
/* ========================================================= */

.leader-item{

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:
    rgba(255,255,255,.05);

    border-radius:14px;

    padding:14px;

    margin-top:12px;
}

/* ========================================================= */
/* CHAT */
/* ========================================================= */

#chatBox{

    max-height:320px;

    overflow:auto;
}

.chat-message{

    display:flex;

    gap:12px;

    align-items:center;

    background:
    rgba(255,255,255,.05);

    padding:12px;

    border-radius:14px;

    margin-top:10px;
}

.chat-message img{

    width:50px;
    height:50px;

    border-radius:50%;
}

.chat-controls{

    display:flex;

    gap:10px;

    margin-top:16px;
}

.chat-controls input{

    flex:1;

    padding:12px;

    border:none;

    border-radius:14px;
}

/* ========================================================= */
/* MOBILE */
/* ========================================================= */

@media(max-width:900px){

    .sidebar{

        width:90px;
    }

    .main{

        margin-left:110px;
    }

    .grid{

        grid-template-columns:
        1fr;
    }

}

</style>
</head>
<body>

<!-- ========================================================= -->
<!-- SIDEBAR -->
<!-- ========================================================= -->

<div
id="sidebar"
class="sidebar">

    <div>

        <div class="sidebar-logo">

            ♟ NeonChess

        </div>

        <div class="sidebar-menu">

            <button class="side-btn">
                ▶ Play
            </button>

            <button class="side-btn">
                📚 Lesson
            </button>

            <button class="side-btn">
                🧩 Trainer
            </button>

            <button class="side-btn">
                📺 NeonChess TV
            </button>

            <button class="side-btn">
                🔍 Search Player
            </button>

            <button class="side-btn">
                👤 Account
            </button>

            <button class="side-btn">
                ⚙ Settings
            </button>

        </div>

    </div>

    <div>

        <button
        class="collapse-btn"
        onclick="toggleSidebar()">

            ☰

        </button>

    </div>

</div>

<!-- ========================================================= -->
<!-- MAIN -->
<!-- ========================================================= -->

<div class="main">

    <!-- TOPBAR -->

    <div class="topbar">

        <div class="logo">

            NeonChess

        </div>

        <div class="top-buttons">

            <button
            id="loginBtn"
            class="login-btn"
            onclick="loginGoogle()">

                🔐 Login

            </button>

            <button
            id="logoutBtn"
            class="logout-btn"
            onclick="logoutGoogle()"
            style="display:none;">

                Logout

            </button>

        </div>

    </div>

    <!-- GRID -->

    <div class="grid">

        <!-- PROFILE -->

        <div class="card">

            <h2>👤 Profile</h2>

            <div class="profile">

                <img
                id="avatar"
                class="avatar">

                <div>

                    <h2 id="name">
                        Guest
                    </h2>

                    <p id="email">
                        Chưa đăng nhập
                    </p>

                    <div class="badge">

                        ADMIN SITE

                    </div>

                </div>

            </div>

            <div class="stats">

                <div class="stat">

                    🪙 Coin

                    <div
                    id="coin"
                    class="stat-value">

                        0

                    </div>

                </div>

                <div class="stat">

                    🏆 ELO

                    <div
                    id="elo"
                    class="stat-value">

                        1200

                    </div>

                </div>

                <div class="stat">

                    🔥 Streak

                    <div
                    id="streak"
                    class="stat-value">

                        0

                    </div>

                </div>

            </div>

            <button
            class="store-btn"
            onclick="buyFreeze()">

                Buy Streak Freeze (100 Coin)

            </button>

            <button
            class="room-btn"
            onclick="createRoom()">

                Create Multiplayer Room

            </button>

        </div>

        <!-- LEADERBOARD -->

        <div class="card">

            <h2>🏆 Global Leaderboard</h2>

            <div id="leaderboard"></div>

        </div>

        <!-- CHAT -->

        <div class="card">

            <h2>💬 Realtime Chat</h2>

            <div id="chatBox"></div>

            <div class="chat-controls">

                <input
                id="chatInput"
                placeholder="Nhắn gì đó...">

                <button onclick="sendChat()">

                    Send

                </button>

            </div>

        </div>

    </div>

</div>

<!-- ========================================================= -->
<!-- FIREBASE -->
<!-- ========================================================= -->

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {

    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut

} from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {

    getDatabase,
    ref,
    set,
    get,
    push,
    onValue,
    update

} from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

/* ========================================================= */
/* FIREBASE CONFIG */
/* ========================================================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyByZbESWCAXypIJKBUNIm6KDmcXWX7SMgk",

    authDomain:
    "neonchess-df7aa.firebaseapp.com",

    databaseURL:
    "https://neonchess-df7aa-default-rtdb.firebaseio.com",

    projectId:
    "neonchess-df7aa",

    storageBucket:
    "neonchess-df7aa.firebasestorage.app",

    messagingSenderId:
    "784833820179",

    appId:
    "1:784833820179:web:3613d907d2a5b321bff1e6",

    measurementId:
    "G-LBDENJ65N7"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getDatabase(app);

const provider =
new GoogleAuthProvider();

window.currentUser = null;

/* ========================================================= */
/* SIDEBAR */
/* ========================================================= */

window.toggleSidebar = function(){

    document.getElementById(
        "sidebar"
    ).classList.toggle(
        "collapsed"
    );

}

/* ========================================================= */
/* LOGIN */
/* ========================================================= */

window.loginGoogle =
async function(){

    await signInWithPopup(
        auth,
        provider
    );

}

/* ========================================================= */
/* LOGOUT */
/* ========================================================= */

window.logoutGoogle =
async function(){

    await signOut(auth);

}

/* ========================================================= */
/* AUTO LOGIN */
/* ========================================================= */

onAuthStateChanged(auth,
async(user)=>{

    if(!user){

        document.getElementById(
            "loginBtn"
        ).style.display =
        "inline-block";

        document.getElementById(
            "logoutBtn"
        ).style.display =
        "none";

        return;
    }

    currentUser = user;

    document.getElementById(
        "loginBtn"
    ).style.display =
    "none";

    document.getElementById(
        "logoutBtn"
    ).style.display =
    "inline-block";

    await createUserData();

    loadProfile();

    loadLeaderboard();

    loadChat();

});

/* ========================================================= */
/* CREATE USER */
/* ========================================================= */

async function createUserData(){

    const userRef =
    ref(
        db,
        "users/" + currentUser.uid
    );

    const snap =
    await get(userRef);

    if(!snap.exists()){

        await set(userRef,{

            name:
            currentUser.displayName,

            email:
            currentUser.email,

            avatar:
            currentUser.photoURL,

            coin:500,

            elo:1200,

            streak:0,

            admin:true

        });

    }

}

/* ========================================================= */
/* PROFILE */
/* ========================================================= */

function loadProfile(){

    const userRef =
    ref(
        db,
        "users/" + currentUser.uid
    );

    onValue(userRef,(snap)=>{

        const data =
        snap.val();

        if(!data) return;

        document.getElementById(
            "avatar"
        ).src =
        data.avatar;

        document.getElementById(
            "name"
        ).textContent =
        data.name;

        document.getElementById(
            "email"
        ).textContent =
        data.email;

        document.getElementById(
            "coin"
        ).textContent =
        data.coin;

        document.getElementById(
            "elo"
        ).textContent =
        data.elo;

        document.getElementById(
            "streak"
        ).textContent =
        data.streak;

    });

}

/* ========================================================= */
/* STORE */
/* ========================================================= */

window.buyFreeze =
async function(){

    const userRef =
    ref(
        db,
        "users/" + currentUser.uid
    );

    const snap =
    await get(userRef);

    const data =
    snap.val();

    if(data.coin < 100){

        alert(
            "Không đủ Coin"
        );

        return;
    }

    await update(userRef,{

        coin:
        data.coin - 100,

        streakFreeze:true

    });

    alert(
        "Đã mua Streak Freeze"
    );

}

/* ========================================================= */
/* LEADERBOARD */
/* ========================================================= */

function loadLeaderboard(){

    onValue(
        ref(db,"users"),
        (snap)=>{

        const data =
        snap.val();

        if(!data) return;

        const players =
        Object.values(data);

        players.sort(
            (a,b)=>
            b.elo - a.elo
        );

        const board =
        document.getElementById(
            "leaderboard"
        );

        board.innerHTML = "";

        players
        .slice(0,10)
        .forEach((p,i)=>{

            board.innerHTML += `

            <div class="leader-item">

                <div>
                    #${i+1} ${p.name}
                </div>

                <div>
                    ${p.elo} ELO
                </div>

            </div>

            `;

        });

    });

}

/* ========================================================= */
/* CHAT */
/* ========================================================= */

window.sendChat =
async function(){

    if(!currentUser) return;

    const input =
    document.getElementById(
        "chatInput"
    );

    if(!input.value) return;

    await push(
        ref(db,"chat"),
        {

            name:
            currentUser.displayName,

            avatar:
            currentUser.photoURL,

            message:
            input.value,

            time:
            Date.now()

        }
    );

    input.value = "";

}

function loadChat(){

    onValue(
        ref(db,"chat"),
        (snap)=>{

        const data =
        snap.val();

        if(!data) return;

        const messages =
        Object.values(data);

        const box =
        document.getElementById(
            "chatBox"
        );

        box.innerHTML = "";

        messages.forEach(msg=>{

            box.innerHTML += `

            <div class="chat-message">

                <img src="${msg.avatar}">

                <div>

                    <b>
                        ${msg.name}
                    </b>

                    <br>

                    ${msg.message}

                </div>

            </div>

            `;

        });

    });

}

/* ========================================================= */
/* MULTIPLAYER */
/* ========================================================= */

window.createRoom =
async function(){

    if(!currentUser) return;

    const roomRef =
    push(ref(db,"rooms"));

    await set(roomRef,{

        host:
        currentUser.uid,

        hostName:
        currentUser.displayName,

        createdAt:
        Date.now()

    });

    alert(
        "Room ID: " +
        roomRef.key
    );

}

console.log(
    "NeonChess Ultimate Ready"
);

</script>

</body>
</html>
