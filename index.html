<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NeonChess Login Firebase</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #020617
    );

    color:white;

    font-family:
    Arial,
    sans-serif;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;
}

/* ========================================================= */
/* CARD */
/* ========================================================= */

.card{

    width:430px;

    background:
    rgba(255,255,255,.06);

    backdrop-filter:
    blur(18px);

    border:
    1px solid rgba(255,255,255,.08);

    border-radius:30px;

    padding:40px;

    text-align:center;

    box-shadow:
    0 0 45px rgba(0,255,180,.15);
}

/* ========================================================= */
/* TITLE */
/* ========================================================= */

.logo{

    font-size:60px;

    margin-bottom:10px;
}

.title{

    font-size:42px;

    font-weight:900;

    margin-bottom:12px;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.subtitle{

    opacity:.7;

    margin-bottom:35px;
}

/* ========================================================= */
/* LOGIN BUTTON */
/* ========================================================= */

.google-btn{

    width:100%;

    border:none;

    background:white;

    color:#111;

    padding:18px;

    border-radius:18px;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.google-btn:hover{

    transform:
    scale(1.03);
}

/* ========================================================= */
/* PROFILE */
/* ========================================================= */

.profile{

    display:none;

    margin-top:30px;
}

.avatar{

    width:110px;
    height:110px;

    border-radius:50%;

    border:
    4px solid #00ffae;

    box-shadow:
    0 0 30px rgba(0,255,174,.4);

    margin-bottom:18px;
}

.name{

    font-size:30px;

    font-weight:900;

    margin-bottom:8px;
}

.email{

    opacity:.7;

    margin-bottom:20px;
}

.badge{

    display:inline-block;

    padding:10px 18px;

    border-radius:999px;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;

    font-weight:900;

    margin-bottom:25px;
}

/* ========================================================= */
/* STATS */
/* ========================================================= */

.stats{

    display:flex;

    gap:12px;

    margin-top:10px;
}

.stat{

    flex:1;

    background:
    rgba(255,255,255,.05);

    border-radius:18px;

    padding:16px;
}

.stat-title{

    opacity:.6;

    margin-bottom:8px;

    font-size:14px;
}

.stat-value{

    font-size:28px;

    font-weight:900;
}

/* ========================================================= */
/* LOGOUT */
/* ========================================================= */

.logout{

    margin-top:24px;

    border:none;

    background:#ff4d4d;

    color:white;

    padding:14px 24px;

    border-radius:16px;

    cursor:pointer;

    font-size:16px;

    font-weight:700;
}

/* ========================================================= */
/* FOOTER */
/* ========================================================= */

.footer{

    margin-top:28px;

    opacity:.45;

    font-size:14px;
}

</style>

</head>
<body>

<div class="card">

    <div class="logo">
        ♟
    </div>

    <div class="title">
        NeonChess
    </div>

    <div class="subtitle">
        Firebase Login System
    </div>

    <!-- LOGIN -->

    <button
    id="loginBtn"
    class="google-btn"
    onclick="loginGoogle()">

        🔐 Đăng nhập với Google

    </button>

    <!-- PROFILE -->

    <div
    class="profile"
    id="profile">

        <img
        id="avatar"
        class="avatar">

        <div
        id="name"
        class="name">
        </div>

        <div
        id="email"
        class="email">
        </div>

        <div class="badge">
            ADMIN SITE
        </div>

        <div class="stats">

            <div class="stat">

                <div class="stat-title">
                    ELO
                </div>

                <div class="stat-value">
                    1200
                </div>

            </div>

            <div class="stat">

                <div class="stat-title">
                    Coin
                </div>

                <div class="stat-value">
                    500
                </div>

            </div>

            <div class="stat">

                <div class="stat-title">
                    Streak
                </div>

                <div class="stat-value">
                    0
                </div>

            </div>

        </div>

        <button
        class="logout"
        onclick="logoutGoogle()">

            Logout

        </button>

    </div>

    <div class="footer">
        NeonChess Firebase Edition
    </div>

</div>

<!-- ========================================================= -->
<!-- FIREBASE -->
<!-- ========================================================= -->

<script type="module">

/* ========================================================= */
/* IMPORT */
/* ========================================================= */

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {

    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut

} from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

/* ========================================================= */
/* FIREBASE CONFIG */
/* ========================================================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyByZbESWCAXypIJKBUNIm6KDmcXWX7SMgk",

    authDomain:
    "neonchess-df7aa.firebaseapp.com",

    projectId:
    "neonchess-df7aa",

    storageBucket:
    "neonchess-df7aa.firebasestorage.app",

    messagingSenderId:
    "784833820179",

    appId:
    "1:784833820179:web:3613d907d2a5b321bff1e6"

};

/* ========================================================= */
/* INIT */
/* ========================================================= */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const provider =
new GoogleAuthProvider();

/* ========================================================= */
/* LOGIN */
/* ========================================================= */

window.loginGoogle =
async function(){

    try{

        await signInWithPopup(
            auth,
            provider
        );

    }catch(err){

        console.error(err);

        alert(
            "❌ Login thất bại!"
        );

    }

}

/* ========================================================= */
/* LOGOUT */
/* ========================================================= */

window.logoutGoogle =
async function(){

    await signOut(auth);

}

/* ========================================================= */
/* AUTO LOGIN */
/* ========================================================= */

onAuthStateChanged(auth,(user)=>{

    const profile =
    document.getElementById(
        "profile"
    );

    const loginBtn =
    document.getElementById(
        "loginBtn"
    );

    if(user){

        loginBtn.style.display =
        "none";

        profile.style.display =
        "block";

        document.getElementById(
            "avatar"
        ).src =
        user.photoURL;

        document.getElementById(
            "name"
        ).textContent =
        user.displayName;

        document.getElementById(
            "email"
        ).textContent =
        user.email;

        console.log(
            "Logged in:",
            user.displayName
        );

    }else{

        loginBtn.style.display =
        "block";

        profile.style.display =
        "none";

    }

});

console.log(
    "Firebase Login Ready"
);

</script>

</body>
</html>
