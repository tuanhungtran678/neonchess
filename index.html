<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NeonChess Ultra</title>

<style>

/* ========================= */
/* BASE */
/* ========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#070b1a;
    color:white;
    overflow:hidden;
}

/* ========================= */
/* NEON BACKGROUND */
/* ========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top,#00ffae33,transparent 40%),
    radial-gradient(circle at bottom,#00c3ff33,transparent 40%);
    animation:move 8s linear infinite;
}

@keyframes move{
    0%{transform:translate(0,0)}
    50%{transform:translate(-20px,20px)}
    100%{transform:translate(0,0)}
}

/* ========================= */
/* SIDEBAR */
/* ========================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:240px;
    height:100vh;
    background:#0b1025ee;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    border-right:1px solid #ffffff10;
}

.side-btn{
    padding:12px;
    border:none;
    background:#ffffff10;
    color:white;
    border-radius:12px;
    cursor:pointer;
}

.side-btn:hover{
    background:#00ffae33;
}

/* ========================= */
/* MAIN */
/* ========================= */

.main{
    margin-left:260px;
    height:100vh;
    display:grid;
    grid-template-rows:70px 1fr;
}

/* ========================= */
/* TOPBAR */
/* ========================= */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px;
    background:#0b1025aa;
    border-bottom:1px solid #ffffff10;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#00ffae;
}

.btn{
    padding:10px 14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#00ffae,#00c3ff);
    cursor:pointer;
}

/* ========================= */
/* LAYOUT */
/* ========================= */

.content{
    display:grid;
    grid-template-columns:1.4fr 1fr 1fr;
    gap:10px;
    padding:10px;
}

/* ========================= */
/* CARD */
/* ========================= */

.card{
    background:#0f1733aa;
    border:1px solid #ffffff10;
    border-radius:16px;
    padding:10px;
    backdrop-filter:blur(10px);
}

/* ========================= */
/* BOARD */
/* ========================= */

.board{
    width:100%;
    aspect-ratio:1/1;
    display:grid;
    grid-template-columns:repeat(8,1fr);
}

.square{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.light{background:#f0d9b5}
.dark{background:#b58863}

.piece{
    width:80%;
    cursor:grab;
}

/* ========================= */
/* CHAT */
/* ========================= */

.chat-box{
    height:300px;
    overflow:auto;
    display:flex;
    flex-direction:column;
    gap:6px;
}

.msg{
    padding:6px;
    background:#ffffff10;
    border-radius:8px;
    font-size:12px;
}

.time{
    font-size:10px;
    opacity:.6;
}

/* ========================= */
/* TIMER */
/* ========================= */

.timer-btn{
    padding:6px;
    margin:3px;
    border:none;
    border-radius:8px;
    background:#ffffff10;
    color:white;
    cursor:pointer;
}

</style>
</head>
<body>

<!-- ================= SIDEBAR ================= -->

<div class="sidebar">
    <button class="side-btn">Home</button>
    <button class="side-btn">Play</button>
    <button class="side-btn">Puzzle</button>
    <button class="side-btn">Chat</button>
</div>

<!-- ================= MAIN ================= -->

<div class="main">

<!-- TOP -->
<div class="topbar">
    <div class="logo">NeonChess</div>
    <button class="btn" id="loginBtn">Login Google</button>
</div>

<!-- CONTENT -->
<div class="content">

<!-- BOARD -->
<div class="card">
    <h3>Board</h3>
    <div class="board" id="board"></div>

    <div>
        <button class="timer-btn" onclick="setTime(10)">10s</button>
        <button class="timer-btn" onclick="setTime(30)">30s</button>
        <button class="timer-btn" onclick="setTime(86400)">Daily</button>
    </div>

    <div id="timer">--</div>
</div>

<!-- CHAT -->
<div class="card">
    <h3>Chat</h3>

    <div class="chat-box" id="chat"></div>

    <input id="msg" placeholder="Message...">
    <button onclick="sendMsg()">Send</button>
</div>

<!-- PROFILE -->
<div class="card">
    <h3>Profile</h3>
    <div id="user">Guest</div>
    <div>Coin: <span id="coin">0</span></div>
    <div>ELO: 1200</div>
</div>

</div>
</div>

<!-- ================= FIREBASE ================= -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import {
getAuth,
GoogleAuthProvider,
signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
getDatabase,
ref,
push,
onValue
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

const firebaseConfig = {
apiKey:"xxx",
authDomain:"xxx",
databaseURL:"xxx",
projectId:"xxx"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();

/* LOGIN */

document.getElementById("loginBtn").onclick = async ()=>{
await signInWithPopup(auth,provider);
document.getElementById("loginBtn").innerText="Logged";
};

/* CHAT */

window.sendMsg = function(){

const msg = document.getElementById("msg").value;

push(ref(db,"chat"),{
text:msg,
time:Date.now()
});

document.getElementById("msg").value="";
};

onValue(ref(db,"chat"),snap=>{

const box = document.getElementById("chat");
box.innerHTML="";

snap.forEach(d=>{

const v = d.val();

box.innerHTML += `
<div class="msg">
${v.text}
<div class="time">${new Date(v.time).toLocaleTimeString()}</div>
</div>`;

});

});

/* TIMER */

let time = 0;
let interval;

window.setTime = (t)=>{
time = t;
clearInterval(interval);

interval = setInterval(()=>{
time--;
document.getElementById("timer").innerText=time;

if(time<=0) clearInterval(interval);

},1000);
};

/* SIMPLE BOARD */

const board = document.getElementById("board");

for(let i=0;i<64;i++){

const sq = document.createElement("div");
sq.className = "square " + ((Math.floor(i/8)+i)%2?"dark":"light");
board.appendChild(sq);

}

</script>

</body>
</html>
