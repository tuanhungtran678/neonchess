<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NeonChess</title>

<style>

/* ========================================================= */
/* RESET */
/* ========================================================= */

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

    font-family:
    "Segoe UI",
    sans-serif;
}

body{

    background:
    linear-gradient(
        135deg,
        #050816,
        #0b1120,
        #111827
    );

    color:white;

    overflow-x:hidden;
}

/* ========================================================= */
/* BACKGROUND */
/* ========================================================= */

.bg{

    position:fixed;

    inset:0;

    overflow:hidden;

    z-index:-1;
}

.glow{

    position:absolute;

    border-radius:50%;

    filter:blur(120px);

    opacity:.18;
}

.glow1{

    width:500px;
    height:500px;

    background:#00ffae;

    top:-120px;
    left:-120px;
}

.glow2{

    width:500px;
    height:500px;

    background:#00c3ff;

    right:-120px;
    bottom:-120px;
}

/* ========================================================= */
/* LAYOUT */
/* ========================================================= */

.container{

    display:grid;

    grid-template-columns:
    280px 1fr;

    min-height:100vh;
}

/* ========================================================= */
/* SIDEBAR */
/* ========================================================= */

.sidebar{

    background:
    linear-gradient(
        180deg,
        #111827,
        #0b1120
    );

    border-right:
    1px solid rgba(255,255,255,.06);

    padding:26px;

    display:flex;

    flex-direction:column;
}

.logo{

    font-size:40px;

    font-weight:900;

    margin-bottom:36px;

    color:white;
}

.menu{

    display:flex;

    flex-direction:column;

    gap:14px;
}

.menu button{

    border:none;

    background:
    rgba(255,255,255,.04);

    color:white;

    padding:18px;

    border-radius:22px;

    text-align:left;

    font-size:17px;

    font-weight:800;

    cursor:pointer;

    transition:.22s;

    display:flex;

    align-items:center;

    gap:14px;

    position:relative;

    overflow:hidden;
}

.menu button::before{

    content:"";

    position:absolute;

    inset:0;

    background:
    linear-gradient(
        90deg,
        rgba(0,255,174,.16),
        rgba(0,195,255,.16)
    );

    opacity:0;

    transition:.25s;
}

.menu button:hover::before{

    opacity:1;
}

.menu button:hover{

    transform:
    translateX(8px)
    scale(1.02);

    box-shadow:
    0 0 24px rgba(0,255,174,.15);
}

/* ========================================================= */
/* MAIN */
/* ========================================================= */

.main{

    padding:26px;
}

/* ========================================================= */
/* TOPBAR */
/* ========================================================= */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:24px;
}

.title{

    font-size:46px;

    font-weight:900;
}

.login-btn{

    border:none;

    padding:14px 22px;

    border-radius:18px;

    font-weight:900;

    cursor:pointer;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;
}

/* ========================================================= */
/* HERO */
/* ========================================================= */

.hero{

    position:relative;

    overflow:hidden;

    background:
    linear-gradient(
        135deg,
        rgba(255,255,255,.05),
        rgba(255,255,255,.02)
    );

    border:
    1px solid rgba(255,255,255,.08);

    border-radius:38px;

    padding:42px;

    margin-bottom:26px;
}

.hero::before{

    content:"";

    position:absolute;

    width:420px;
    height:420px;

    background:
    radial-gradient(
        rgba(0,255,174,.22),
        transparent 70%
    );

    top:-180px;
    right:-100px;
}

.hero h1{

    font-size:64px;

    line-height:1.05;

    margin-bottom:16px;
}

.hero span{

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.hero p{

    color:#cbd5e1;

    font-size:19px;

    line-height:1.7;
}

/* ========================================================= */
/* CONTENT */
/* ========================================================= */

.content{

    display:grid;

    grid-template-columns:
    1fr 340px;

    gap:22px;
}

/* ========================================================= */
/* CARD */
/* ========================================================= */

.card{

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,.05),
        rgba(255,255,255,.03)
    );

    border:
    1px solid rgba(255,255,255,.08);

    border-radius:34px;

    padding:24px;

    backdrop-filter:
    blur(24px);

    box-shadow:
    0 10px 40px rgba(0,0,0,.25);
}

/* ========================================================= */
/* BOARD */
/* ========================================================= */

.board{

    width:min(82vw,720px);

    aspect-ratio:1/1;

    display:grid;

    grid-template-columns:
    repeat(8,1fr);

    border-radius:24px;

    overflow:hidden;

    box-shadow:
    0 0 50px rgba(0,255,174,.18);

    margin:auto;
}

.square{

    aspect-ratio:1/1;

    position:relative;

    display:flex;

    justify-content:center;

    align-items:center;
}

.light{

    background:#f0d9b5;
}

.dark{

    background:#b58863;
}

.selected{

    box-shadow:
    inset 0 0 0 5px #00ffae;
}

.move::after{

    content:"";

    width:18px;
    height:18px;

    border-radius:50%;

    background:
    rgba(0,255,174,.72);

    position:absolute;
}

.piece{

    width:78%;

    height:78%;

    object-fit:contain;

    cursor:grab;

    user-select:none;

    -webkit-user-drag:none;

    transition:.12s;
}

.piece:hover{

    transform:scale(1.08);
}

/* ========================================================= */
/* BUTTONS */
/* ========================================================= */

.god-buttons{

    display:flex;

    gap:12px;

    flex-wrap:wrap;

    margin-top:22px;
}

.god-buttons button{

    border:none;

    padding:14px 18px;

    border-radius:16px;

    font-weight:900;

    cursor:pointer;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;
}

/* ========================================================= */
/* HISTORY */
/* ========================================================= */

.history{

    margin-top:22px;

    background:
    rgba(255,255,255,.05);

    border-radius:18px;

    padding:16px;
}

/* ========================================================= */
/* PROFILE */
/* ========================================================= */

.profile{

    text-align:center;
}

.avatar{

    width:110px;
    height:110px;

    border-radius:50%;

    border:
    4px solid #00ffae;

    margin-bottom:16px;
}

.badge{

    display:inline-block;

    margin-top:10px;

    padding:8px 14px;

    border-radius:999px;

    background:
    linear-gradient(
        90deg,
        #00ffae,
        #00c3ff
    );

    color:#001b12;

    font-weight:900;
}

.stats{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:12px;

    margin-top:22px;
}

.stat{

    background:
    rgba(255,255,255,.05);

    border-radius:18px;

    padding:14px;
}

.stat-value{

    font-size:28px;

    font-weight:900;

    margin-top:8px;
}

</style>
</head>
<body>

<div class="bg">

    <div class="glow glow1"></div>

    <div class="glow glow2"></div>

</div>

<div class="container">

    <!-- ===================================================== -->
    <!-- SIDEBAR -->
    <!-- ===================================================== -->

    <div class="sidebar">

        <div class="logo">

            ♟ NeonChess

        </div>

        <div class="menu">

            <button onclick="startBullet()">
                ⚡ Bullet
            </button>

            <button onclick="startBlitz()">
                🔥 Blitz
            </button>

            <button onclick="startRapid()">
                🧠 Rapid
            </button>

            <button onclick="startMultiplayer()">
                🌍 Multiplayer
            </button>

            <button onclick="startPuzzle()">
                🧩 Puzzle Rush
            </button>

            <button onclick="playVsAI()">
                🤖 Play vs AI
            </button>

        </div>

    </div>

    <!-- ===================================================== -->
    <!-- MAIN -->
    <!-- ===================================================== -->

    <div class="main">

        <div class="topbar">

            <div class="title">

                NeonChess

            </div>

            <button
            class="login-btn"
            id="loginBtn">

                🔐 Login Google

            </button>

        </div>

        <div class="hero">

            <h1>

                Play Chess
                <span>Like PS5</span>

            </h1>

            <p>

                Neon gaming UI,
                realtime chess,
                Puzzle Rush,
                AI engine,
                multiplayer
                and cloud profiles.

            </p>

        </div>

        <div class="content">

            <!-- ================================================= -->
            <!-- BOARD -->
            <!-- ================================================= -->

            <div class="card">

                <div
                id="board"
                class="board"></div>

                <div class="god-buttons">

                    <button onclick="newGame()">
                        ♻ New Game
                    </button>

                    <button onclick="analyzeGame()">
                        🧠 Analyze
                    </button>

                </div>

                <div class="history">

                    <b>📜 Move History</b>

                    <div id="moves"></div>

                </div>

            </div>

            <!-- ================================================= -->
            <!-- PROFILE -->
            <!-- ================================================= -->

            <div class="card">

                <div class="profile">

                    <img
                    id="avatar"
                    class="avatar"
                    src="https://i.pravatar.cc/200">

                    <h2
                    id="username"
                    style="
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    gap:10px;
                    ">

                        Guest

                        <img
                        src="https://flagcdn.com/w40/vn.png"
                        style="
                        width:32px;
                        border-radius:4px;
                        ">

                    </h2>

                    <p id="email">

                        Not logged in

                    </p>

                    <div class="badge">

                        ADMIN SITE

                    </div>

                    <div class="stats">

                        <div class="stat">

                            🪙

                            <div class="stat-value">

                                500

                            </div>

                        </div>

                        <div class="stat">

                            🏆

                            <div class="stat-value">

                                1200

                            </div>

                        </div>

                        <div class="stat">

                            🔥

                            <div class="stat-value">

                                0

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script type="module">

/* ========================================================= */
/* CHESS */
/* ========================================================= */

import { Chess }
from
"https://cdn.jsdelivr.net/npm/chess.js@1.0.0-beta.6/+esm";

/* ========================================================= */
/* FIREBASE */
/* ========================================================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {

getAuth,
GoogleAuthProvider,
signInWithPopup,
signOut,
onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

/* ========================================================= */
/* FIREBASE CONFIG */
/* ========================================================= */

const firebaseConfig = {

apiKey:
"AIzaSyByZbESWCAXypIJKBUNIm6KDmcXWX7SMgk",

authDomain:
"neonchess-df7aa.firebaseapp.com",

databaseURL:
"https://neonchess-df7aa-default-rtdb.firebaseio.com",

projectId:
"neonchess-df7aa",

storageBucket:
"neonchess-df7aa.firebasestorage.app",

messagingSenderId:
"784833820179",

appId:
"1:784833820179:web:3613d907d2a5b321bff1e6",

measurementId:
"G-LBDENJ65N7"

};

const app =
initializeApp(
firebaseConfig
);

const auth =
getAuth(app);

const provider =
new GoogleAuthProvider();

/* ========================================================= */
/* LOGIN */
/* ========================================================= */

const loginBtn =
document.getElementById(
"loginBtn"
);

loginBtn.onclick =
()=>{

signInWithPopup(
auth,
provider
);

};

onAuthStateChanged(

auth,

(user)=>{

if(user){

document.getElementById(
"username"
).childNodes[0].textContent =
user.displayName + " ";

document.getElementById(
"email"
).textContent =
user.email;

document.getElementById(
"avatar"
).src =
user.photoURL;

loginBtn.innerHTML =
"🚪 Logout";

loginBtn.onclick =
()=>{

signOut(auth);

};

}

else{

document.getElementById(
"username"
).childNodes[0].textContent =
"Guest ";

document.getElementById(
"email"
).textContent =
"Not logged in";

loginBtn.innerHTML =
"🔐 Login Google";

}

}

/* ========================================================= */
/* STOCKFISH */
/* ========================================================= */

let stockfish =
null;

try{

stockfish =
new Worker(
"https://cdn.jsdelivr.net/npm/stockfish@16.0.0/src/stockfish-nnue-16-single.js"
);

console.log(
"Stockfish loaded"
);

}catch(e){

console.log(
"Stockfish failed"
);

}

/* ========================================================= */
/* GAME */
/* ========================================================= */

const game =
new Chess();

const board =
document.getElementById(
"board"
);

let selected =
null;

let dragFrom =
null;

/* ========================================================= */
/* PIECES */
/* ========================================================= */

const pieces = {

r:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/br.png",
n:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bn.png",
b:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bb.png",
q:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bq.png",
k:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bk.png",
p:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bp.png",

R:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wr.png",
N:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wn.png",
B:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wb.png",
Q:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wq.png",
K:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wk.png",
P:"https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wp.png"

};

/* ========================================================= */
/* DRAW BOARD */
/* ========================================================= */

function drawBoard(){

board.innerHTML =
"";

const current =
game.board();

for(let y=0;y<8;y++){

for(let x=0;x<8;x++){

const square =
document.createElement(
"div"
);

square.className =
"square " +
(
(x+y)%2===0
? "light"
: "dark"
);

const file =
"abcdefgh"[x];

const rank =
8-y;

const name =
file + rank;

square.dataset.square =
name;

const piece =
current[y][x];

if(piece){

const code =
piece.color==="w"
? piece.type.toUpperCase()
: piece.type;

const img =
document.createElement(
"img"
);

img.src =
pieces[code];

img.className =
"piece";

img.draggable =
true;

/* ===================================================== */
/* DRAG */
/* ===================================================== */

img.addEventListener(

"dragstart",

()=>{

dragFrom =
name;

selected =
name;

}

);

square.appendChild(
img
);

}

/* ===================================================== */
/* CLICK */
/* ===================================================== */

square.onclick =
()=>{

if(selected===name){

selected =
null;

drawBoard();

return;

}

if(selected){

const move =
game.move({

from:selected,
to:name,
promotion:"q"

});

if(move){

selected =
null;

drawBoard();

updateHistory();

return;

}

}

const p =
game.get(name);

if(p){

selected =
name;

drawBoard();

highlight(name);

showMoves(name);

}

};

/* ===================================================== */
/* DROP */
/* ===================================================== */

square.addEventListener(

"dragover",

(e)=>{

e.preventDefault();

}

);

square.addEventListener(

"drop",

()=>{

if(!dragFrom)return;

const move =
game.move({

from:dragFrom,
to:name,
promotion:"q"

});

if(move){

drawBoard();

updateHistory();

}

selected =
null;

dragFrom =
null;

}

);

board.appendChild(
square
);

}

}

}

/* ========================================================= */
/* HIGHLIGHT */
/* ========================================================= */

function highlight(name){

const sq =
document.querySelector(
`[data-square="${name}"]`
);

if(sq){

sq.classList.add(
"selected"
);

}

}

/* ========================================================= */
/* SHOW MOVES */
/* ========================================================= */

function showMoves(square){

const moves =
game.moves({

square:square,
verbose:true

});

moves.forEach(move=>{

const sq =
document.querySelector(
`[data-square="${move.to}"]`
);

if(sq){

sq.classList.add(
"move"
);

}

});

}

/* ========================================================= */
/* HISTORY */
/* ========================================================= */

function updateHistory(){

document.getElementById(
"moves"
).innerHTML =
game.history().join(" ");

}

/* ========================================================= */
/* BUTTONS */
/* ========================================================= */

window.newGame =
()=>{

game.reset();

drawBoard();

updateHistory();

};

window.analyzeGame =
()=>{

if(!stockfish){

alert(
"❌ Stockfish failed"
);

return;

}

stockfish.postMessage(
"position fen " + game.fen()
);

stockfish.postMessage(
"go depth 12"
);

alert(
"🧠 Analysis started"
);

};

window.playVsAI =
()=>{

alert(
"🤖 AI mode coming soon"
);

};

window.startPuzzle =
()=>{

game.load(
"8/8/8/8/4k3/8/3Q4/4K3 w - - 0 1"
);

drawBoard();

};

window.startBullet =
()=>{

alert(
"⚡ Bullet 1+0"
);

};

window.startBlitz =
()=>{

alert(
"🔥 Blitz 3+2"
);

};

window.startRapid =
()=>{

alert(
"🧠 Rapid 10m"
);

};

window.startMultiplayer =
()=>{

alert(
"🌍 Multiplayer coming soon"
);

};

/* ========================================================= */
/* START */
/* ========================================================= */

drawBoard();

</script>

</body>
</html>
